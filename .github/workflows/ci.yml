name: CI

on:
  push:
    branches: [main, chatgpt/question-bank-editorial-cleanup]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_FLAGS: >-
    -project EZTrivia.xcodeproj
    -scheme EZTrivia
    -destination generic/platform=iOS

jobs:
  editorial:
    name: Apply one-shot editorial cleanup
    if: github.ref == 'refs/heads/chatgpt/question-bank-editorial-cleanup' && github.event.head_commit.message == 'Trigger editorial cleanup through CI'
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Python
        run: apt-get update && apt-get install -y python3
      - name: Fix one-shot script anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("Scripts/chatgpt_editorial_cleanup.py")
          text = path.read_text(encoding="utf-8")
          old = '(\'        "geography-easy-9",\', \'        "geography-easy-9", "geography-medium-42",\'),'
          new = '(\'"geography-easy-9", "geography-hard-3",\', \'"geography-easy-9", "geography-medium-42", "geography-hard-3",\'),'
          if old not in text:
              raise SystemExit("anchor patch target missing")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Apply editorial fixes
        run: python3 Scripts/chatgpt_editorial_cleanup.py
      - name: Check authored seed syntax
        run: python3 Scripts/check_seed_syntax.py
      - name: Regenerate review catalog
        run: swift run QuestionCatalogExporter > QuestionReview.csv
      - name: Run editorial report
        run: python3 Scripts/analyze_questions.py --top 10
      - name: Run core tests
        run: swift test
      - name: Commit generated cleanup
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add QuestionReview.csv Scripts/analyze_questions.py Sources/EZTriviaCore/QuestionReviewMetadata.swift Sources/EZTriviaCore/Questions Tests/EZTriviaCoreTests/QuestionQualityTests.swift
          git -C "$GITHUB_WORKSPACE" commit -m "Polish question bank after editorial review"
          git -C "$GITHUB_WORKSPACE" push origin HEAD:chatgpt/question-bank-editorial-cleanup

  engine:
    name: Core package
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      # The question bank is pure Swift with no Apple frameworks, so it tests on
      # Linux in seconds. This is where the content guarantees are enforced: a
      # duplicated prompt, a tier sharing questions with another, or two
      # near-identical flags offered together all fail here.
      - run: swift build
      - run: swift test
      - run: swift build -c release

  catalog:
    name: Review CSV is current
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate and diff
        run: |
          swift run QuestionCatalogExporter > /tmp/QuestionReview.csv
          if ! diff -q QuestionReview.csv /tmp/QuestionReview.csv > /dev/null; then
            echo "::error::QuestionReview.csv is stale. Run: swift run QuestionCatalogExporter > QuestionReview.csv"
            diff QuestionReview.csv /tmp/QuestionReview.csv | head -40
            exit 1
          fi
          echo "QuestionReview.csv matches the question bank."

  app:
    name: Build and archive app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Report what the runner actually has rather than pinning a guess.
      - name: Probe the runner
        run: |
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # Pinned deliberately: iOS 18.5 SDK, which satisfies Apple's current
          # submission floor. The probe step above lists what the runner has,
          # so raising this is a one-line change when Apple moves the floor.
          # Apple requires the iOS 26 SDK or later for any App Store upload:
          # a build made with 18.5 is rejected at validation with a 409. Pinned
          # to the 26 major so patch updates to the runner image are tolerated
          # but the SDK floor is never crossed downward. The probe step reports
          # what is actually installed if this ever needs raising.
          xcode-version: '26'

      - name: Install xcbeautify
        run: brew list xcbeautify >/dev/null 2>&1 || brew install xcbeautify

      # `build` is not a strong enough check on a hand-written project file.
      # `archive` walks the target graph differently and catches malformed
      # package-product references that `build` accepts. Unsigned archiving
      # needs no Apple credentials, so the release path gets exercised on every
      # push instead of only when we try to ship.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build $XCODE_FLAGS -configuration Debug \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/build.log | xcbeautify

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive $XCODE_FLAGS -configuration Release \
            -archivePath "$RUNNER_TEMP/EZTrivia.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee /tmp/archive.log | xcbeautify

      # Raw xcodebuild output is thousands of lines; surface only the errors.
      - name: Surface errors
        if: failure()
        run: |
          for f in /tmp/build.log /tmp/archive.log; do
            [ -f "$f" ] || continue
            echo "───── $f ─────"
            grep -E "error:|error " "$f" | sort -u | head -40 || echo "(no error: lines)"
          done