name: iPad screenshots

# Captures App Store screenshots from an iPad simulator on the macOS runner,
# so shipping an iPad build does not require owning an iPad or a Mac.
#
# The simulator renders at the real device resolution, so what comes out is
# already the exact size App Store Connect wants -- no scaling, no padding.

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Simulator device name to match"
        type: string
        default: "iPad Pro 13-inch"

jobs:
  screenshots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      # Matched at run time rather than pinned: Apple renames iPad models every
      # cycle, and a hardcoded name turns into a confusing "device not found"
      # the first time the runner image moves.
      - name: Find an iPad simulator
        id: sim
        env:
          WANTED: ${{ inputs.device }}
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - "$RUNNER_TEMP/devices.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys

          wanted = os.environ["WANTED"].lower()
          data = json.load(open(sys.argv[1]))["devices"]
          for runtime, devices in sorted(data.items(), reverse=True):
              for device in devices:
                  if wanted in device["name"].lower():
                      print("udid=" + device["udid"])
                      print("name=" + device["name"], file=sys.stderr)
                      sys.exit(0)
          sys.exit("no available simulator matching: " + wanted)
          PY
          echo "Using $(grep '^udid=' "$GITHUB_OUTPUT" | tail -1)"

      - name: Build for the simulator
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          xcodebuild build \
            -project EZTrivia.xcodeproj \
            -scheme EZTrivia \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot, install, and capture
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          # Debug-only flag: suppresses the Game Center sign-in failure alert
          # and the AdMob test-ad placeholder, neither of which may appear in
          # a screenshot submitted to App Review.
          SCREENSHOT_FLAG: "-EZTriviaScreenshotMode"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shots"

          app=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name "*.app" | head -1)
          echo "app bundle: $app"

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # Status bar is part of the screenshot, so it gets the clean values
          # Apple's own marketing shots use rather than a runner's clock.
          xcrun simctl status_bar "$UDID" override \
            --time "9:41" --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 --wifiMode active --wifiBars 3 || true

          xcrun simctl install "$UDID" "$app"

          capture() {
            sleep "${2:-6}"
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/$1.png"
            echo "captured $1"
          }

          # Appearance is set before each launch and the app is restarted
          # between them. Flipping it under a running app looked like it
          # worked -- simctl exits 0 -- but produced two byte-identical PNGs.
          shoot() {
            xcrun simctl terminate "$UDID" com.rsm.eztrivia 2>/dev/null || true
            xcrun simctl ui "$UDID" appearance "$2"
            xcrun simctl launch "$UDID" com.rsm.eztrivia "$SCREENSHOT_FLAG"
            capture "$1" 12
          }

          shoot "01-home-light" light
          shoot "02-home-dark" dark

          python3 - "$RUNNER_TEMP/shots" <<'PY'
          import hashlib, pathlib, struct, sys

          seen, failed = {}, False
          for path in sorted(pathlib.Path(sys.argv[1]).glob("*.png")):
              raw = path.read_bytes()
              width, height = struct.unpack(">II", raw[16:24])
              digest = hashlib.sha256(raw).hexdigest()
              print(f"{path.name}: {width} x {height}  {digest[:12]}")
              if digest in seen:
                  print(f"  !! identical to {seen[digest]} -- the capture did not change")
                  failed = True
              seen[digest] = path.name
          sys.exit(1 if failed else 0)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ipad-screenshots
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: error
