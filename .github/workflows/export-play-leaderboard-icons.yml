name: Export EZ Trivia leaderboard icons for Play Games

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-play-leaderboard-icons.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Reuse existing 17 Game Center leaderboard designs at Play Games resolution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          from PIL import Image, ImageDraw, ImageFont

          mapping = [
              ('daily','daily-challenge','Daily Challenge'),
              ('football','football','Football'),
              ('basketball','basketball','Basketball'),
              ('soccer','soccer','Soccer'),
              ('flags','world-flags','World Flags'),
              ('history','history','History'),
              ('science','science','Science'),
              ('movies','movies','Movies'),
              ('tv','tv','TV'),
              ('geography','geography','Geography'),
              ('music','music','Music'),
              ('animals','animals','Animals'),
              ('food','food-and-drink','Food & Drink'),
              ('literature','books-and-literature','Books & Literature'),
              ('art','art-and-architecture','Art & Architecture'),
              ('mythology','mythology-and-legends','Mythology & Legends'),
              ('videoGames','video-games','Video Games'),
          ]
          target = Path('docs/play-games-assets/leaderboards')
          target.mkdir(parents=True, exist_ok=True)
          jpeg_target = Path('docs/play-games-assets/leaderboards-jpeg')
          jpeg_target.mkdir(parents=True, exist_ok=True)
          names = []
          jpeg_names = []
          sheet = Image.new('RGB',(5*230,4*260),(243,244,249))
          draw = ImageDraw.Draw(sheet)
          font_path = Path('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf')
          font = ImageFont.truetype(str(font_path), 17) if font_path.exists() else ImageFont.load_default()
          for idx,(source_slug,output_slug,title) in enumerate(mapping):
              source = Path('Artwork/Leaderboards') / f'EZTrivia.{source_slug}.png'
              assert source.exists(), source
              out=target / f'{output_slug}.png'
              with Image.open(source) as im:
                  assert im.width==im.height and im.width>=512, (source,im.size)
                  im.convert('RGBA').resize((512,512),Image.Resampling.LANCZOS).save(out,format='PNG',optimize=True)
              with Image.open(out) as im:
                  assert im.size==(512,512) and im.mode=='RGBA', (out,im.size,im.mode)
                  thumb=im.convert('RGB').resize((190,190),Image.Resampling.LANCZOS)
                  x=(idx%5)*230+20
                  y=(idx//5)*260+12
                  sheet.paste(thumb,(x,y))
                  w=draw.textbbox((0,0),title,font=font)[2]
                  draw.text((x+max(0,(190-w)//2),y+199),title,font=font,fill=(24,25,36))
              assert out.stat().st_size < 1024*1024,(out,out.stat().st_size)
              fallback = jpeg_target / f'{output_slug}.jpg'
              with Image.open(out) as im:
                  im.convert('RGB').save(fallback,format='JPEG',quality=92,subsampling=0,optimize=True)
              with Image.open(fallback) as im:
                  assert im.format == 'JPEG' and im.mode == 'RGB' and im.size == (512,512), fallback
                  im.verify()
              assert fallback.stat().st_size < 1024*1024, (fallback,fallback.stat().st_size)
              names.append(out)
              jpeg_names.append(fallback)
              print(f'{title}: PNG={out.stat().st_size} bytes; JPEG={fallback.stat().st_size} bytes')
          assert len(names)==17
          sheet.save('docs/play-games-assets/leaderboards-preview.png',format='PNG',optimize=True)
          with ZipFile('docs/play-games-assets/EZTrivia_Play_Games_Leaderboard_Icons.zip','w',ZIP_DEFLATED) as z:
              for file in names:
                  z.write(file,arcname=file.name)
          with ZipFile('docs/play-games-assets/EZTrivia_Play_Games_Leaderboard_Icons_JPEG.zip','w',ZIP_DEFLATED) as z:
              for file in jpeg_names:
                  z.write(file,arcname=file.name)
          print('Validated 17 distinct 512x512 RGBA PNG icons and 17 baseline RGB JPEG alternatives')
          PY
      - name: Commit Play Games icons for simple mobile download
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/play-games-assets/leaderboards docs/play-games-assets/leaderboards-preview.png docs/play-games-assets/EZTrivia_Play_Games_Leaderboard_Icons.zip docs/play-games-assets/leaderboards-jpeg docs/play-games-assets/EZTrivia_Play_Games_Leaderboard_Icons_JPEG.zip
          if git diff --cached --quiet; then
            echo 'All leaderboard images are current.'
          else
            git commit -m 'docs: export existing 17 leaderboard icons for Google Play Games [skip ci]'
            git push origin HEAD:main
          fi
