name: Android Play v5 closed rollout

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/android-play-v5-closed-rollout.yml"

permissions:
  contents: read

concurrency:
  group: android-play-v5-closed-rollout
  cancel-in-progress: false

jobs:
  rollout:
    name: Build v5 and update existing closed test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PACKAGE_NAME: com.rsm.eztrivia
      CLOSED_TRACK: production-access
      VERSION_CODE: "5"
      VERSION_NAME: 1.0.0-alpha05
      RELEASE_NAME: EZ Trivia 1.0.0-alpha05 closed test
      RELEASE_NOTES: Adds crash diagnostics and in-app feedback/reporting, with Android stability and release-testing improvements.
      ANDROID_ADMOB_APP_ID: ca-app-pub-1217971050094766~1085041409
      ANDROID_ADMOB_BANNER_ID: ca-app-pub-1217971050094766/1190439457

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release configuration and credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$PLAY_SERVICE_ACCOUNT"
          [[ "$ANDROID_ADMOB_APP_ID" =~ ^ca-app-pub-1217971050094766~[0-9]+$ ]]
          [[ "$ANDROID_ADMOB_BANNER_ID" =~ ^ca-app-pub-1217971050094766/[0-9]+$ ]]

      - name: Authenticate to Google Play Developer API
        id: play_auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Guard existing live tracks before any Play mutation
        env:
          ACCESS_TOKEN: ${{ steps.play_auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${PACKAGE_NAME}/tracks"
          auth=(-H "Authorization: Bearer ${ACCESS_TOKEN}" -H "Accept: application/json")
          curl --fail-with-body --silent --show-error "${base}/${CLOSED_TRACK}/releases" "${auth[@]}" > "$RUNNER_TEMP/closed-before.json"
          curl --fail-with-body --silent --show-error "${base}/internal/releases" "${auth[@]}" > "$RUNNER_TEMP/internal-before.json"

          closed_v4="$(jq -r '[.releases[]? | select(any(.activeArtifacts[]?.versionCode; . == 4)) | .releaseLifecycleState] | first // "absent"' "$RUNNER_TEMP/closed-before.json")"
          internal_v4="$(jq -r '[.releases[]? | select(any(.activeArtifacts[]?.versionCode; . == 4)) | .releaseLifecycleState] | first // "absent"' "$RUNNER_TEMP/internal-before.json")"
          closed_v5="$(jq -r '[.releases[]? | select(any(.activeArtifacts[]?.versionCode; . == 5)) | .releaseLifecycleState] | first // "absent"' "$RUNNER_TEMP/closed-before.json")"
          internal_v5="$(jq -r '[.releases[]? | select(any(.activeArtifacts[]?.versionCode; . == 5)) | .releaseLifecycleState] | first // "absent"' "$RUNNER_TEMP/internal-before.json")"

          echo "closed v4=${closed_v4} internal v4=${internal_v4} closed v5=${closed_v5} internal v5=${internal_v5}"
          if [ "$closed_v5" != "absent" ] || [ "$internal_v5" != "absent" ]; then
            echo "::error::v5 already exists on Google Play; refusing duplicate rollout."
            exit 2
          fi
          if [ "$closed_v4" != "RELEASE_LIFECYCLE_STATE_PUBLISHED" ]; then
            echo "::error::Expected published closed-test v4 on existing ${CLOSED_TRACK}; found ${closed_v4}."
            exit 3
          fi
          if [ "$internal_v4" != "RELEASE_LIFECYCLE_STATE_PUBLISHED" ]; then
            echo "::error::Expected published Internal v4; found ${internal_v4}."
            exit 4
          fi

      - name: Refresh Google Play Data Safety declaration for Crashlytics-enabled release
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.play_auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          pip install --quiet requests
          python Scripts/configure_play_data_safety.py --submit
          test -s play-data-safety/eztrivia-data-safety.csv

      - name: Authenticate to Firebase Management API
        id: firebase_auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false

      - name: Materialize required Firebase Android config
        env:
          ACCESS_TOKEN: ${{ steps.firebase_auth.outputs.access_token }}
          SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          project_id="$(jq -r '.project_id // empty' <<<"$SERVICE_ACCOUNT")"
          test -n "$project_id"
          auth=(-H "Authorization: Bearer ${ACCESS_TOKEN}" -H "Accept: application/json")
          base="https://firebase.googleapis.com/v1beta1"

          apps="$(curl --fail-with-body --silent --show-error "${base}/projects/${project_id}/androidApps" "${auth[@]}")"
          app_name="$(jq -r '[.apps[]? | select(.packageName == "com.rsm.eztrivia") | .name] | first // empty' <<<"$apps")"
          if [[ -z "$app_name" ]]; then
            echo "::error::Firebase Android app com.rsm.eztrivia is missing; refusing v5 release without Crashlytics."
            exit 10
          fi

          config="$(curl --fail-with-body --silent --show-error "${base}/${app_name}/config" "${auth[@]}")"
          jq -r '.configFileContents' <<<"$config" | base64 --decode > android/app/google-services.json
          jq -e '
            any(.client[]?;
              .client_info.android_client_info.package_name == "com.rsm.eztrivia" and
              (.client_info.mobilesdk_app_id | type == "string" and length > 0)
            )
          ' android/app/google-services.json >/dev/null
          echo "Firebase Crashlytics config materialized for com.rsm.eztrivia."

      - name: Assert Firebase Analytics is absent
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:dependencies --configuration releaseRuntimeClasspath > "$RUNNER_TEMP/release-runtime-deps.txt"
          if grep -Eq 'com\.google\.firebase:firebase-analytics([:-]|$)' "$RUNNER_TEMP/release-runtime-deps.txt"; then
            echo "::error::Firebase Analytics entered the release graph; refusing v5."
            grep 'com.google.firebase:firebase-analytics' "$RUNNER_TEMP/release-runtime-deps.txt" || true
            exit 11
          fi

      - name: Materialize upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/eztrivia-upload.p12"
          keytool -list \
            -keystore "$RUNNER_TEMP/eztrivia-upload.p12" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias upload >/dev/null
          chmod 600 "$RUNNER_TEMP/eztrivia-upload.p12"

      - name: Run Android unit tests
        working-directory: android
        run: gradle testDebugUnitTest --stacktrace

      - name: Build signed production-configured v5 bundle
        working-directory: android
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/eztrivia-upload.p12
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          EZTRIVIA_VERSION_CODE: ${{ env.VERSION_CODE }}
          EZTRIVIA_VERSION_NAME: ${{ env.VERSION_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          gradle bundleRelease --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Verify bundle signature
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      - name: Prepare Play release notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/play-notes"
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/play-notes/whatsnew-en-US"

      - name: Publish v5 to Google Play Internal Testing
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.rsm.eztrivia
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          releaseName: EZ Trivia 1.0.0-alpha05 (v5)
          whatsNewDirectory: ${{ runner.temp }}/play-notes
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt

      - name: Verify v5 on Internal and update existing closed track only
        env:
          ACCESS_TOKEN: ${{ steps.play_auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${PACKAGE_NAME}"
          auth=(-H "Authorization: Bearer ${ACCESS_TOKEN}" -H "Content-Type: application/json")
          edit_id=""

          cleanup() {
            if [ -n "$edit_id" ]; then
              curl --silent --show-error -X DELETE "${base}/edits/${edit_id}" "${auth[@]}" >/dev/null || true
            fi
          }
          trap cleanup EXIT

          edit_json="$(curl --fail-with-body --silent --show-error -X POST "${base}/edits" "${auth[@]}" -d '{}')"
          edit_id="$(jq -r '.id' <<<"$edit_json")"

          internal_json="$(curl --fail-with-body --silent --show-error "${base}/edits/${edit_id}/tracks/internal" "${auth[@]}")"
          if ! jq -e --arg version "$VERSION_CODE" 'any(.releases[]?.versionCodes[]?; . == $version)' <<<"$internal_json" >/dev/null; then
            echo "::error::v5 upload returned but versionCode 5 is not present on Internal."
            exit 20
          fi

          closed_url="${base}/edits/${edit_id}/tracks/${CLOSED_TRACK}"
          closed_json="$(curl --fail-with-body --silent --show-error "$closed_url" "${auth[@]}")"
          release_count="$(jq '(.releases // []) | length' <<<"$closed_json")"
          if [ "$release_count" != "1" ]; then
            echo "::error::Expected exactly one current release on ${CLOSED_TRACK}; found ${release_count}."
            exit 21
          fi
          current_version="$(jq -r '.releases[0].versionCodes[0] // ""' <<<"$closed_json")"
          current_status="$(jq -r '.releases[0].status // ""' <<<"$closed_json")"
          if [ "$current_version" != "4" ] || [ "$current_status" != "completed" ]; then
            echo "::error::Expected existing closed release v4/completed; found v${current_version}/${current_status}."
            exit 22
          fi

          jq -n \
            --arg track "$CLOSED_TRACK" \
            --arg name "$RELEASE_NAME" \
            --arg version "$VERSION_CODE" \
            --arg notes "$RELEASE_NOTES" \
            '{track:$track,releases:[{name:$name,versionCodes:[$version],status:"completed",releaseNotes:[{language:"en-US",text:$notes}]}]}' \
            > "$RUNNER_TEMP/closed-v5.json"

          curl --fail-with-body --silent --show-error -X PUT "$closed_url" "${auth[@]}" \
            --data-binary @"$RUNNER_TEMP/closed-v5.json" > "$RUNNER_TEMP/closed-update-response.json"

          curl --fail-with-body --silent --show-error -X POST "${base}/edits/${edit_id}:validate" "${auth[@]}" -d '{}' \
            > "$RUNNER_TEMP/validate-response.json"

          commit_code="$(curl --silent --show-error -o "$RUNNER_TEMP/commit-response.json" -w '%{http_code}' \
            -X POST "${base}/edits/${edit_id}:commit?changesInReviewBehavior=ERROR_IF_IN_REVIEW" "${auth[@]}" -d '{}')"
          if [ "$commit_code" != "200" ]; then
            cat "$RUNNER_TEMP/commit-response.json"
            echo "::error::Closed-test v5 commit failed with HTTP ${commit_code}; edit will be abandoned."
            exit 23
          fi
          edit_id=""

      - name: Verify live closed-test lifecycle after commit
        env:
          ACCESS_TOKEN: ${{ steps.play_auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${PACKAGE_NAME}/tracks/${CLOSED_TRACK}/releases"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Accept: application/json" \
            "$url" > "$RUNNER_TEMP/closed-after.json"
          jq -r '.releases[]? | "track=\(.track) releaseName=\(.releaseName) versionCodes=\([.activeArtifacts[]?.versionCode] | join(",")) lifecycle=\(.releaseLifecycleState)"' "$RUNNER_TEMP/closed-after.json"
          if ! jq -e 'any(.releases[]?.activeArtifacts[]?.versionCode; . == 5)' "$RUNNER_TEMP/closed-after.json" >/dev/null; then
            echo "::error::Closed-test commit completed but live track does not show v5."
            exit 30
          fi

      - name: Archive v5 release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eztrivia-play-v5-closed-rollout
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
            play-data-safety/eztrivia-data-safety.csv
            ${{ runner.temp }}/closed-before.json
            ${{ runner.temp }}/internal-before.json
            ${{ runner.temp }}/closed-after.json
            ${{ runner.temp }}/validate-response.json
            ${{ runner.temp }}/commit-response.json
          if-no-files-found: warn
          retention-days: 30
