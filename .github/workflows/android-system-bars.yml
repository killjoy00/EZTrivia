name: Android system bar regression

on:
  pull_request:
    paths:
      - ".github/workflows/android-system-bars.yml"
      - "android/**"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/android-system-bars.yml"
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  system-bars:
    name: System bars (${{ matrix.navigation }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        navigation: [gestural, threebutton]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify controls stay clear of Android navigation UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          disable-animations: true
          script: |
            set -euo pipefail
            overlay="com.android.internal.systemui.navbar.${{ matrix.navigation }}"
            echo "Switching emulator to $overlay"
            adb shell cmd overlay list | grep 'com.android.internal.systemui.navbar' || true
            adb shell cmd overlay enable-exclusive --category "$overlay"
            sleep 3
            adb shell cmd overlay list | grep -E "\[x\].*${{ matrix.navigation }}" || {
              echo "Requested navigation overlay did not become active"
              exit 2
            }
            cd android
            gradle connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.rsm.eztrivia.MainSystemBarInsetsTest,com.rsm.eztrivia.DailySystemBarInsetsTest,com.rsm.eztrivia.FriendSystemBarInsetsTest \
              --stacktrace

      - name: Surface instrumentation results
        if: always()
        run: |
          find android/app/build/outputs/androidTest-results/connected \
            -type f -name '*.xml' -print -exec cat {} \; 2>/dev/null || true
