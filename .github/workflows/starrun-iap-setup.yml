name: StarRun Remove Ads IAP draft setup
on:
  push:
    branches: [main]
    paths: ['.github/starrun-iap-request.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: starrun-iap-draft
  cancel-in-progress: false
jobs:
  apple-draft:
    name: Create or verify StarRun non-consumable draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet "PyJWT[crypto]"
      - name: Create or inspect Apple IAP draft (never submit)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_KEY_P8"
          python Scripts/setup_starrun_iap.py
