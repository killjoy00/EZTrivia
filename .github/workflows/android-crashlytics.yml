name: Android Crashlytics configured build

on:
  pull_request:
    paths:
      - ".github/workflows/android-crashlytics.yml"
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-crashlytics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configured-build:
    name: Build and initialize configured Crashlytics
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Authenticate to Firebase Management API
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false

      - name: Materialize real Firebase Android config
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          project_id="$(jq -r '.project_id // empty' <<<"$SERVICE_ACCOUNT")"
          test -n "$project_id"
          auth=(-H "Authorization: Bearer ${ACCESS_TOKEN}" -H "Accept: application/json")
          base="https://firebase.googleapis.com/v1beta1"

          apps="$(curl --fail-with-body --silent --show-error "${base}/projects/${project_id}/androidApps" "${auth[@]}")"
          app_name="$(jq -r '[.apps[]? | select(.packageName == "com.rsm.eztrivia") | .name] | first // empty' <<<"$apps")"
          if [[ -z "$app_name" ]]; then
            echo "::error::Firebase Android app com.rsm.eztrivia is missing."
            exit 10
          fi

          config="$(curl --fail-with-body --silent --show-error "${base}/${app_name}/config" "${auth[@]}")"
          jq -r '.configFileContents' <<<"$config" | base64 --decode > android/app/google-services.json
          jq -e '
            any(.client[]?;
              .client_info.android_client_info.package_name == "com.rsm.eztrivia" and
              (.client_info.mobilesdk_app_id | type == "string" and length > 0)
            )
          ' android/app/google-services.json >/dev/null
          echo "Firebase config materialized for com.rsm.eztrivia."

      - name: Build minified release with Crashlytics plugins active
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify Firebase and Crashlytics initialize at runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          disable-animations: true
          script: |
            set -euo pipefail
            cd android
            gradle connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.rsm.eztrivia.CrashlyticsConfigurationTest \
              --stacktrace

      - name: Surface instrumentation results
        if: always()
        run: |
          find android/app/build/outputs/androidTest-results/connected \
            -type f -name '*.xml' -print -exec cat {} \; 2>/dev/null || true
