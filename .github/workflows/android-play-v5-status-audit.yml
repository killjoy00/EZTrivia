name: Android Play v5 status audit

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/android-play-v5-status-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PACKAGE_NAME: com.rsm.eztrivia
      CLOSED_TRACK: production-access
    steps:
      - name: Authenticate to Google Play Developer API
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Read current closed and Internal lifecycle
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${PACKAGE_NAME}/tracks"
          auth=(-H "Authorization: Bearer ${ACCESS_TOKEN}" -H "Accept: application/json")
          curl --fail-with-body --silent --show-error "${base}/${CLOSED_TRACK}/releases" "${auth[@]}" > "$RUNNER_TEMP/closed.json"
          curl --fail-with-body --silent --show-error "${base}/internal/releases" "${auth[@]}" > "$RUNNER_TEMP/internal.json"
          echo "CLOSED"
          jq -r '.releases[]? | "track=\(.track) releaseName=\(.releaseName) versionCodes=\([.activeArtifacts[]?.versionCode] | join(",")) lifecycle=\(.releaseLifecycleState)"' "$RUNNER_TEMP/closed.json"
          echo "INTERNAL"
          jq -r '.releases[]? | "track=\(.track) releaseName=\(.releaseName) versionCodes=\([.activeArtifacts[]?.versionCode] | join(",")) lifecycle=\(.releaseLifecycleState)"' "$RUNNER_TEMP/internal.json"
