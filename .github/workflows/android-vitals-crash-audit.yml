name: Android Vitals crash audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Read v2 crash reports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE_NAME: com.rsm.eztrivia
      VERSION_CODE: "2"
      PROJECT_NUMBER: "406580555223"
      REPORTING_SERVICE: playdeveloperreporting.googleapis.com

    steps:
      - name: Authenticate for Google Cloud service enablement
        id: cloud_auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false

      - name: Ensure Play Developer Reporting API is enabled
        env:
          ACCESS_TOKEN: ${{ steps.cloud_auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          service_url="https://serviceusage.googleapis.com/v1/projects/${PROJECT_NUMBER}/services/${REPORTING_SERVICE}"
          state_file="$RUNNER_TEMP/reporting-service-state.json"
          status="$(curl --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Accept: application/json" \
            -o "$state_file" \
            -w '%{http_code}' \
            "$service_url")"

          if [ "$status" = "200" ] && [ "$(jq -r '.state // ""' "$state_file")" = "ENABLED" ]; then
            echo "Play Developer Reporting API is already enabled."
            exit 0
          fi

          enable_file="$RUNNER_TEMP/reporting-service-enable.json"
          enable_status="$(curl --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            -o "$enable_file" \
            -w '%{http_code}' \
            "${service_url}:enable")"

          if [ "$enable_status" != "200" ]; then
            echo "Could not enable Play Developer Reporting API (HTTP ${enable_status})."
            jq -r '.error.message // .' "$enable_file" 2>/dev/null || cat "$enable_file"
            exit 1
          fi

          echo "Enable request accepted. Waiting for service state to become ENABLED."
          for attempt in $(seq 1 18); do
            sleep 5
            status="$(curl --silent --show-error \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Accept: application/json" \
              -o "$state_file" \
              -w '%{http_code}' \
              "$service_url")"
            if [ "$status" = "200" ] && [ "$(jq -r '.state // ""' "$state_file")" = "ENABLED" ]; then
              echo "Play Developer Reporting API is enabled."
              exit 0
            fi
          done

          echo "Reporting API enablement did not become active within the audit window."
          cat "$state_file"
          exit 1

      - name: Authenticate to Play Developer Reporting API
        id: reporting_auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          access_token_scopes: https://www.googleapis.com/auth/playdeveloperreporting
          create_credentials_file: false

      - name: Query recent v2 crashes
        env:
          ACCESS_TOKEN: ${{ steps.reporting_auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/android-vitals-v2-crashes.json"
          endpoint="https://playdeveloperreporting.googleapis.com/v1alpha1/apps/${PACKAGE_NAME}/errorReports:search"
          filter="versionCode = ${VERSION_CODE} AND errorIssueType = CRASH"

          http_code="$(curl --silent --show-error \
            --get "$endpoint" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Accept: application/json" \
            --data-urlencode "filter=${filter}" \
            --data-urlencode "pageSize=100" \
            -o "$output" \
            -w '%{http_code}')"

          if [ "$http_code" != "200" ]; then
            echo "Play Developer Reporting API returned HTTP ${http_code}."
            jq -r '.error.message // .' "$output" 2>/dev/null || cat "$output"
            exit 1
          fi

          count="$(jq '(.errorReports // []) | length' "$output")"
          echo "Found ${count} recent crash report(s) for versionCode ${VERSION_CODE}."

          {
            echo "## Android Vitals — versionCode ${VERSION_CODE}"
            echo
            echo "Recent crash reports returned: **${count}**"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$count" = "0" ]; then
            echo "No v2 crash reports are available in the API's default recent window yet."
            exit 0
          fi

          jq -r '
            .errorReports[] |
            "=== ANDROID VITALS CRASH ===\n" +
            "Event: " + (.eventTime // "unknown") + "\n" +
            "Type: " + (.type // "unknown") + "\n" +
            "Issue: " + (.issue // "unknown") + "\n" +
            "Version: " + ((.appVersion.versionCode // "unknown") | tostring) + "\n" +
            "Device: " + (.deviceModel.marketingName // "unknown") + "\n" +
            "VCS: " + (.vcsInformation // "unknown") + "\n\n" +
            (.reportText // "(no report text)") + "\n"
          ' "$output"

          jq -r '
            .errorReports[] |
            "- **" + (.eventTime // "unknown") + "** — " +
            (.deviceModel.marketingName // "unknown device") +
            " — `" + (.issue // "unknown issue") + "`"
          ' "$output" >> "$GITHUB_STEP_SUMMARY"
