name: Android Play Production Promotion

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Existing completed Internal versionCode; leave blank only for audit mode"
        required: false
        type: string
      mode:
        description: "Audit only, validate the intended Play edit without committing, or promote to Production"
        required: true
        default: audit
        type: choice
        options:
          - audit
          - validate
          - promote
      confirm_production:
        description: "Required only for promote mode: explicitly allow the Production commit"
        required: true
        default: false
        type: boolean
  # Temporary branch-only probe. Remove before merge so the final workflow is manual-only.
  push:
    branches:
      - android-production-readiness
    paths:
      - Scripts/play_production_candidate.py
      - .github/workflows/android-play-production.yml

permissions:
  contents: read

concurrency:
  group: android-play-production-promotion
  cancel-in-progress: false

jobs:
  production:
    name: Audit or promote existing Play bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Play Developer API
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Audit / validate / promote Production candidate
        id: production
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'audit' }}
          VERSION_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.version_code || '' }}
          CONFIRM_PRODUCTION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_production || false }}
          OUTPUT: ${{ runner.temp }}/play-production-candidate.json
        shell: bash
        run: |
          set -euo pipefail
          args=(--mode "$MODE" --output "$OUTPUT")
          if [ -n "$VERSION_CODE" ]; then
            if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::version_code must be a positive integer"
              exit 1
            fi
            args+=(--version-code "$VERSION_CODE")
          elif [ "$MODE" != "audit" ]; then
            echo "::error::version_code is required for validate/promote mode"
            exit 1
          fi
          python Scripts/play_production_candidate.py "${args[@]}"

      - name: Summarize Production readiness
        if: always()
        env:
          OUTPUT: ${{ runner.temp }}/play-production-candidate.json
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$OUTPUT" ]; then
            echo '## Google Play Production readiness' >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo '_No evidence file was produced; inspect the failed step logs._' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '## Google Play Production readiness'
            echo
            echo "- Candidate versionCode: **$(jq -r '.candidateVersionCode' "$OUTPUT")**"
            echo "- Highest completed Internal versionCode: **$(jq -r '.highestInternalCompletedVersionCode' "$OUTPUT")**"
            echo "- Production versionCodes: **$(jq -r '(.productionVersionCodes | map(tostring) | join(",")) // ""' "$OUTPUT")**"
            echo "- Promotable by automated guard: **$(jq -r '.promotable' "$OUTPUT")**"
            echo "- Play edit validated: **$(jq -r '.validated' "$OUTPUT")**"
            echo "- Production commit performed: **$(jq -r '.committed' "$OUTPUT")**"
            blockers="$(jq -r '.blockers[]?' "$OUTPUT")"
            if [ -n "$blockers" ]; then
              echo
              echo '### Blockers'
              while IFS= read -r blocker; do
                echo "- $blocker"
              done <<< "$blockers"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive non-secret Production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eztrivia-play-production-candidate
          path: ${{ runner.temp }}/play-production-candidate.json
          if-no-files-found: warn
          retention-days: 30
