name: Create Remove Ads Legacy Product

on:
  push:
    branches:
      - android-launch-console-setup-3
    paths:
      - .github/workflows/create-remove-ads-legacy.yml
      - Scripts/create_remove_ads_legacy.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-auth requests
      - name: Create and verify Remove Ads managed product
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: python Scripts/create_remove_ads_legacy.py
