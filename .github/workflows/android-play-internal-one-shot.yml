name: Android Play Internal One Shot

on:
  push:
    branches:
      - android-launch-console-setup-3
    paths:
      - .github/workflows/android-play-internal-one-shot.yml

permissions:
  contents: read

concurrency:
  group: android-play-internal-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish v2 to Internal Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Validate signing and Play credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          ADMOB_APP_ID: ${{ secrets.ANDROID_ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ANDROID_ADMOB_BANNER_ID }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$PLAY_SERVICE_ACCOUNT"
          if [[ -z "$ADMOB_APP_ID" || -z "$ADMOB_BANNER_ID" ]]; then
            echo "::warning::Android AdMob production IDs are still absent; v2 will use Google's sample IDs and is Internal Testing only."
          fi

      - name: Materialize upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/eztrivia-upload.p12"
          keytool -list -keystore "$RUNNER_TEMP/eztrivia-upload.p12" -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -alias upload >/dev/null
          chmod 600 "$RUNNER_TEMP/eztrivia-upload.p12"

      - name: Run Android unit tests
        working-directory: android
        run: gradle testDebugUnitTest --stacktrace

      - name: Build signed release bundle
        working-directory: android
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/eztrivia-upload.p12
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_ADMOB_APP_ID: ${{ secrets.ANDROID_ADMOB_APP_ID }}
          ANDROID_ADMOB_BANNER_ID: ${{ secrets.ANDROID_ADMOB_BANNER_ID }}
          EZTRIVIA_VERSION_CODE: "2"
          EZTRIVIA_VERSION_NAME: "1.0.0-alpha02"
        run: gradle bundleRelease --stacktrace

      - name: Verify bundle signature
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      - name: Prepare release notes
        run: |
          mkdir -p "$RUNNER_TEMP/play-notes"
          cat > "$RUNNER_TEMP/play-notes/whatsnew-en-US" <<'EOF'
          Adds Google Play Games progress sync, achievements and leaderboards, plus Android monetization and launch-readiness updates.
          EOF

      - name: Publish to Google Play Internal Testing
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.rsm.eztrivia
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          releaseName: EZ Trivia 1.0.0-alpha02 (v2)
          whatsNewDirectory: ${{ runner.temp }}/play-notes
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt

      - name: Archive release outputs
        uses: actions/upload-artifact@v4
        with:
          name: eztrivia-play-v2
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30
