name: Ultimate TTT - Update Play Data safety for Android ads
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ultttt-play-data-safety-ads-v4.yml'
permissions:
  contents: read
jobs:
  disclosure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'requests>=2.31'
      - name: Validate exact AdMob SDK and Android package in merged app
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS 'https://raw.githubusercontent.com/killjoy00/Ultttt/main/android/app/build.gradle.kts' > "$RUNNER_TEMP/ultttt-build.gradle.kts"
          grep -Fq 'applicationId = "com.killjoy00.ultttt"' "$RUNNER_TEMP/ultttt-build.gradle.kts"
          grep -Fq 'play-services-ads:25.5.0' "$RUNNER_TEMP/ultttt-build.gradle.kts"
          grep -Fq 'com.android.billingclient:billing:9.1.0' "$RUNNER_TEMP/ultttt-build.gradle.kts"
          grep -Fq 'user-messaging-platform:4.0.0' "$RUNNER_TEMP/ultttt-build.gradle.kts"
          python -m py_compile Scripts/configure_ultttt_play_data_safety.py
      - name: Prepare and audit Android-only Data safety CSV
        shell: bash
        run: |
          python Scripts/configure_ultttt_play_data_safety.py
          grep -Fq 'PSL_DEVICE_ID' play-data-safety/ultttt-android-admob-data-safety.csv
          grep -Fq 'PSL_PURCHASE_HISTORY' play-data-safety/ultttt-android-admob-data-safety.csv
      - name: Archive exact privacy declaration for records
        uses: actions/upload-artifact@v4
        with:
          name: ultttt-play-data-safety-v4
          path: play-data-safety/ultttt-android-admob-data-safety.csv
          retention-days: 90
      - name: Authenticate to Google Play with existing publisher service account
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Submit verified Data safety declaration
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python Scripts/configure_ultttt_play_data_safety.py --submit
