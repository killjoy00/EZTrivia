name: Ultimate TTT Android v4 AdMob and Billing production
on:
  push:
    branches: [main]
    paths:
      - '.github/ultttt-android-v4-production-request.json'

permissions:
  contents: read

concurrency:
  group: ultttt-play-v4-admob-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: killjoy00/Ultttt
          ref: main
          fetch-depth: 0
          path: ultttt

      - name: Validate release request, real ad IDs, Play declarations and merged source
        id: approved
        shell: bash
        run: |
          set -euo pipefail
          request=.github/ultttt-android-v4-production-request.json
          test -f "$request"
          test "$(jq -r '.enabled' "$request")" = true
          test "$(jq -r '.publish_production' "$request")" = true
          test "$(jq -r '.play_ads_and_data_safety_confirmed' "$request")" = true
          test "$(jq -r '.package_name' "$request")" = 'com.killjoy00.ultttt'
          test "$(jq -r '.version_code' "$request")" = '4'
          test "$(jq -r '.version_name' "$request")" = '1.1.0'
          test "$(jq -r '.track' "$request")" = 'production'
          source_sha="$(jq -r '.source_sha' "$request")"
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]
          git -C ultttt fetch --quiet origin main
          git -C ultttt merge-base --is-ancestor "$source_sha" origin/main || {
            echo "::error::Release source must be merged to Ultttt/main"; exit 1;
          }
          git -C ultttt checkout --quiet --detach "$source_sha"
          test "$(git -C ultttt rev-parse HEAD)" = "$source_sha"
          app_id="$(jq -r '.admob_android_app_id // empty' "$request")"
          banner_id="$(jq -r '.admob_android_banner_unit_id // empty' "$request")"
          [[ "$app_id" =~ ^ca-app-pub-1217971050094766~[0-9]{10}$ ]] || {
            echo "::error::Invalid Android AdMob App ID for publisher"; exit 1;
          }
          [[ "$banner_id" =~ ^ca-app-pub-1217971050094766/[0-9]{10}$ ]] || {
            echo "::error::Invalid Android banner ad unit for publisher"; exit 1;
          }
          test -n "$(jq -r '.release_notes // empty' "$request")"
          grep -Fq 'com.android.vending.BILLING' ultttt/android/app/src/main/AndroidManifest.xml
          grep -Fq 'ULTTTT_REQUIRE_LIVE_ADMOB' ultttt/android/app/build.gradle.kts
          curl --fail-with-body -sS --location 'https://killjoy00.github.io/app-ads.txt' \
            > "$RUNNER_TEMP/ultttt-app-ads.txt"
          grep -Fxq 'google.com, pub-1217971050094766, DIRECT, f08c47fec0942fa0' "$RUNNER_TEMP/ultttt-app-ads.txt"
          {
            echo "app_id=$app_id"
            echo "banner_id=$banner_id"
          } >> "$GITHUB_OUTPUT"
          echo "Validated code-4 production source, Google AdMob IDs, Play declarations, and authorized sellers file."

      - name: Authenticate using existing Google Play publisher credentials
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Require activated $1.99 one-time Remove Ads product
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          url='https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.killjoy00.ultttt/oneTimeProducts/com.killjoy00.ultttt.remove_ads'
          curl --fail-with-body -sS -H "Authorization: Bearer $ACCESS_TOKEN" "$url" > "$RUNNER_TEMP/ultttt-product.json"
          jq -e '[.purchaseOptions[] | select(.state == "ACTIVE" and .buyOption != null and any(.regionalPricingAndAvailabilityConfigs[]?; .regionCode == "US" and .price.currencyCode == "USD" and (.price.units | tostring) == "1" and .price.nanos == 990000000))] | length > 0' "$RUNNER_TEMP/ultttt-product.json" >/dev/null || {
            echo "::error::Android Remove Ads must be ACTIVE at USD 1.99 before publishing ads."
            exit 1
          }
          echo "Confirmed Google Play Remove Ads is active at USD 1.99."

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify existing shared Android signing key
        env:
          UPLOAD_KEY_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPLOAD_KEY_B64"
          test -n "$UPLOAD_PASSWORD"
          umask 077
          printf '%s' "$UPLOAD_KEY_B64" | base64 --decode > "$RUNNER_TEMP/ultttt-upload.p12"
          chmod 600 "$RUNNER_TEMP/ultttt-upload.p12"
          keytool -list -keystore "$RUNNER_TEMP/ultttt-upload.p12" -storetype PKCS12 \
            -storepass "$UPLOAD_PASSWORD" -alias upload >/dev/null

      - name: Build verified signed production AAB with live ads and Billing
        working-directory: ultttt
        env:
          ULTTTT_VERSION_CODE: '4'
          ULTTTT_VERSION_NAME: '1.1.0'
          ULTTTT_REQUIRE_LIVE_ADMOB: 'true'
          ULTTTT_ADMOB_ANDROID_APP_ID: ${{ steps.approved.outputs.app_id }}
          ULTTTT_ADMOB_ANDROID_BANNER_UNIT_ID: ${{ steps.approved.outputs.banner_id }}
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/ultttt-upload.p12
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p android testDebugUnitTest assembleDebug bundleRelease
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$aapt" dump permissions android/app/build/outputs/apk/debug/app-debug.apk | grep -Fq 'com.android.vending.BILLING'
          bundle=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$bundle"
          test -s android/app/build/outputs/mapping/release/mapping.txt
          unzip -Z1 "$bundle" | grep -Fxq 'BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map'
          jarsigner -verify "$bundle"

      - name: Archive tested production AAB and exact R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: ultttt-google-play-v4-production-signed
          path: |
            ultttt/android/app/build/outputs/bundle/release/app-release.aab
            ultttt/android/app/build/outputs/mapping/release/mapping.txt
            ultttt/android/app/build/outputs/native-debug-symbols/release/*.zip
          if-no-files-found: error
          retention-days: 90

      - name: Prepare release notes
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/play-notes"
          jq -r '.release_notes' .github/ultttt-android-v4-production-request.json \
            > "$RUNNER_TEMP/play-notes/whatsnew-en-US"

      - name: Submit new Android ads-enabled version to production
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.killjoy00.ultttt
          releaseFiles: ultttt/android/app/build/outputs/bundle/release/app-release.aab
          track: production
          status: completed
          releaseName: Ultimate Tic/Tac/Toe 1.1.0
          whatsNewDirectory: ${{ runner.temp }}/play-notes

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/ultttt-upload.p12"
