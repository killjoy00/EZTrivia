name: Android Signing Secret Presence

on:
  push:
    branches: [android/signing-secret-check]
    paths:
      - ".github/workflows/android-signing-secret-presence.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify upload keystore opens
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64}"
          test -n "${KEYSTORE_PASSWORD}"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/upload.p12"
          keytool -list -keystore "${RUNNER_TEMP}/upload.p12" -storetype PKCS12 -storepass "${KEYSTORE_PASSWORD}" -alias upload >/dev/null
          echo "Android upload signing secrets are usable."
