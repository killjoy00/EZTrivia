name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "Scripts/export_android_catalog.py"
      - "Sources/EZTriviaCore/DailyChallenge.swift"
      - "Sources/EZTriviaCore/FriendChallenge.swift"
      - "Sources/EZTriviaCore/FlagCatalog.swift"
      - "Sources/EZTriviaCore/Models.swift"
      - "Sources/EZTriviaCore/QuestionBank.swift"
      - "QuestionReview.csv"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - "Scripts/export_android_catalog.py"
      - "Sources/EZTriviaCore/DailyChallenge.swift"
      - "Sources/EZTriviaCore/FriendChallenge.swift"
      - "Sources/EZTriviaCore/FlagCatalog.swift"
      - "Sources/EZTriviaCore/Models.swift"
      - "Sources/EZTriviaCore/QuestionBank.swift"
      - "QuestionReview.csv"
      - ".github/workflows/android-ci.yml"

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build and test Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Validate catalog exporter
        working-directory: .
        run: |
          python3 Scripts/export_android_catalog.py \
            --input QuestionReview.csv \
            --flag-catalog Sources/EZTriviaCore/FlagCatalog.swift \
            --output "$RUNNER_TEMP/questions.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from Scripts.export_android_catalog import parse_flag_catalog

          payload = json.loads(Path(os.environ["RUNNER_TEMP"], "questions.json").read_text())
          assert payload["schemaVersion"] == 1
          assert len(payload["questions"]) == 2341
          assert len({q["id"] for q in payload["questions"]}) == 2341

          flags = [q for q in payload["questions"] if q["category"] == "flags"]
          assert len(flags) == 241
          assert all(len(q["flagCode"]) == 2 for q in flags)
          assert all("confusableFlagCodes" in q for q in flags)

          swift_flags = parse_flag_catalog(Path("Sources/EZTriviaCore/FlagCatalog.swift"))
          expected_order = [
              code for code, metadata in swift_flags.items() if metadata["askable"]
          ]
          actual_order = [q["flagCode"] for q in flags]
          assert actual_order == expected_order, "Android flag order drifted from Swift FlagCatalog"
          PY

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Surface unit test failures
        if: failure()
        run: |
          find app/build/test-results/testDebugUnitTest -type f -name '*.xml' -print -exec cat {} \;

      - name: Lint
        run: gradle lintDebug --stacktrace

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      # Release builds are unsigned in ordinary CI. The purpose here is to
      # exercise R8/resource shrinking and the same App Bundle packaging used by
      # Google Play before any signing key is involved.
      - name: Assemble release APK (exercises R8)
        run: gradle assembleRelease --stacktrace

      - name: Audit packaged Play manifest
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$apk"

          apkanalyzer="$(command -v apkanalyzer || true)"
          if [ -z "$apkanalyzer" ]; then
            apkanalyzer="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$apkanalyzer" ] || [ ! -x "$apkanalyzer" ]; then
            echo "::error::apkanalyzer is unavailable on the Android runner"
            exit 1
          fi

          application_id="$($apkanalyzer manifest application-id "$apk")"
          target_sdk="$($apkanalyzer manifest target-sdk "$apk")"
          debuggable="$($apkanalyzer manifest debuggable "$apk")"
          permissions="$($apkanalyzer manifest permissions "$apk")"

          echo "Application ID: $application_id"
          echo "Target SDK: $target_sdk"
          echo "Debuggable: $debuggable"
          printf '%s\n' "$permissions"

          [ "$application_id" = "com.rsm.eztrivia" ] || {
            echo "::error::Unexpected packaged application ID: $application_id"
            exit 1
          }
          [ "$target_sdk" = "36" ] || {
            echo "::error::Unexpected packaged target SDK: $target_sdk"
            exit 1
          }
          [ "$debuggable" = "false" ] || {
            echo "::error::Release APK must not be debuggable"
            exit 1
          }
          grep -Fq 'com.google.android.gms.permission.AD_ID' <<< "$permissions" || {
            echo "::error::Google Mobile Ads is present but packaged AD_ID permission is missing; Play Advertising ID declaration/release behavior would drift"
            exit 1
          }
          if grep -Eq 'android\.permission\.ACCESS_(FINE|COARSE)_LOCATION' <<< "$permissions"; then
            echo "::error::Release APK unexpectedly requests Android location permission"
            exit 1
          fi

          {
            echo '## Android packaged manifest audit'
            echo
            echo "- Application ID: **$application_id**"
            echo "- Target SDK: **$target_sdk**"
            echo "- Release debuggable: **$debuggable**"
            echo '- Google Play Advertising ID permission: **present**'
            echo '- Fine/coarse Android location permissions: **absent**'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bundle release AAB (Play packaging check)
        run: gradle bundleRelease --stacktrace

      - name: Upload CI Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eztrivia-android-ci
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14
