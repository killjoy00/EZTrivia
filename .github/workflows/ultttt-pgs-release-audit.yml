name: UTTT - verify live Play release versions for Games integration

on:
  push:
    branches: [automation/ultttt-play-games-20261121]
    paths:
      - .github/workflows/ultttt-pgs-release-audit.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Play Android Publisher
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Read-only check of version codes and track states
        env:
          PLAY_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          root="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.killjoy00.ultttt/edits"
          auth={"Authorization":"Bearer "+os.environ["PLAY_TOKEN"],"Content-Type":"application/json"}
          def call(method,url,data=None):
              payload=None if data is None else json.dumps(data).encode()
              req=urllib.request.Request(url,method=method,data=payload,headers=auth)
              with urllib.request.urlopen(req,timeout=50) as reply:
                  raw=reply.read()
                  return json.loads(raw) if raw else {}
          edit=call("POST",root,{})["id"]
          try:
              tracks=call("GET",f"{root}/{edit}/tracks").get("tracks",[])
              bundles=call("GET",f"{root}/{edit}/bundles").get("bundles",[])
              version_codes=sorted(set(int(b["versionCode"]) for b in bundles))
              print("UTTT EXISTING BUNDLES:",version_codes)
              for track in tracks:
                  print("TRACK:",track.get("track"),"RELEASES",
                        json.dumps([{"name":r.get("name"),"status":r.get("status"),
                                     "versions":r.get("versionCodes")}
                                    for r in track.get("releases",[])],sort_keys=True))
              print("SAFE NEXT VERSION CODE:",max(version_codes+[5])+1)
          finally:
              call("DELETE",f"{root}/{edit}")
          PY

# Follow-up: check whether version code 6 remained after an uncommitted release-name validation error.
