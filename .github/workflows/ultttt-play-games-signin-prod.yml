name: Ultimate TTT - Play Games v9 production upload retry
on:
  push:
    branches: ['release/ultttt-play-games-signin-20261123']
    paths:
      - '.github/workflows/ultttt-play-games-signin-prod.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: ulttt-play-games-signin-prod
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/release/ultttt-play-games-signin-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_NAME: 'Ultimate Tic/Tac/Toe 1.1.5'
      VERSION_CODE: '9'
      RELEASE_NOTES: 'Improved Google Play Games connection at startup and manual sign-in. If Google Play Games cannot connect, you can copy sign-in details from Statistics for troubleshooting.'
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download the exact tested signed v9 bundle
        uses: actions/download-artifact@v4
        with:
          name: ultttt-play-games-startup-v9-1.1.5-signed
          run-id: 45306835374
          github-token: ${{ github.token }}
          repository: killjoy00/EZTrivia
          path: signed-v9
      - name: Reverify bundle, embedded mapping, and corrected release name
        shell: bash
        run: |
          set -euo pipefail
          aab=signed-v9/bundle/release/app-release.aab
          test -s "$aab"
          test -s signed-v9/mapping/release/mapping.txt
          jarsigner -verify "$aab"
          unzip -Z1 "$aab" > "$RUNNER_TEMP/ultttt-aab-files.txt"
          grep -Fxq 'BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map' "$RUNNER_TEMP/ultttt-aab-files.txt"
          test "$VERSION_CODE" = 9
          test "$RELEASE_NAME" = 'Ultimate Tic/Tac/Toe 1.1.5'
          test "$(printf '%s' "$RELEASE_NAME" | wc -c)" -le 50
          echo 'Verified exact v9 signed artifact. Release name is within the Google Play limit.'
          sha256sum "$aab"
      - name: Authenticate with existing Google Play publisher credentials
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Submit the existing tested version 9 to production
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          api=https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.killjoy00.ultttt
          upload_api=https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/com.killjoy00.ultttt
          aab=signed-v9/bundle/release/app-release.aab
          expected_sha=$(sha256sum "$aab" | cut -d' ' -f1)
          auth="Authorization: Bearer $ACCESS_TOKEN"
          edit_id=$(curl --fail-with-body -sS -X POST "$api/edits" -H "$auth" -H 'Content-Type: application/json' -d '{}' | jq -er '.id')
          cleanup() {
            if [ -n "$edit_id" ]; then
              curl -sS -X DELETE "$api/edits/$edit_id" -H "$auth" >/dev/null || true
            fi
          }
          trap cleanup EXIT
          curl --fail-with-body -sS "$api/edits/$edit_id/tracks" -H "$auth" > "$RUNNER_TEMP/ultttt-tracks.json"
          curl --fail-with-body -sS "$api/edits/$edit_id/bundles" -H "$auth" > "$RUNNER_TEMP/ultttt-bundles.json"
          jq -c '{tracks: [.tracks[] | {track: .track, releases: [(.releases // [])[] | {name, versionCodes, status}]}]}' "$RUNNER_TEMP/ultttt-tracks.json"
          jq -e '[.tracks[] | select(.track == "production") | (.releases // [])[] | (.versionCodes // [])[] | tonumber] | (max // 0) >= 8' "$RUNNER_TEMP/ultttt-tracks.json" >/dev/null
          jq -e '[.tracks[] | (.releases // [])[] | (.versionCodes // [])[] | tonumber] | (max // 0) <= 9' "$RUNNER_TEMP/ultttt-tracks.json" >/dev/null
          jq -e '[.bundles[]? | (.versionCode | tonumber)] | (max // 0) <= 9' "$RUNNER_TEMP/ultttt-bundles.json" >/dev/null
          existing=$(jq -r '[.bundles[]? | select((.versionCode | tostring) == "9")] | first | .sha256 // empty' "$RUNNER_TEMP/ultttt-bundles.json")
          if jq -e 'any(.bundles[]?; (.versionCode | tostring) == "9")' "$RUNNER_TEMP/ultttt-bundles.json" >/dev/null; then
            test -n "$existing"
            test "$(printf '%s' "$existing" | tr '[:upper:]' '[:lower:]')" = "$expected_sha" || { echo '::error::Version 9 already exists with a different or unverifiable SHA-256; refusing to replace it.'; exit 1; }
            echo 'Google already retains the exact signed v9 bundle; reusing it.'
          else
            curl --fail-with-body -sS -X POST "$upload_api/edits/$edit_id/bundles?uploadType=media" \
              -H "$auth" -H 'Content-Type: application/octet-stream' --data-binary @"$aab" > "$RUNNER_TEMP/ultttt-upload-result.json"
            jq -e '(.versionCode | tostring) == "9"' "$RUNNER_TEMP/ultttt-upload-result.json" >/dev/null
            uploaded_sha=$(jq -r '.sha256 // empty' "$RUNNER_TEMP/ultttt-upload-result.json")
            if [ -n "$uploaded_sha" ]; then
              test "$(printf '%s' "$uploaded_sha" | tr '[:upper:]' '[:lower:]')" = "$expected_sha"
            fi
            echo 'Google accepted the signed version 9 bundle.'
          fi
          if jq -e 'any(.tracks[] | select(.track == "production") | (.releases // [])[]; .status == "completed" and any(.versionCodes[]?; tostring == "9"))' "$RUNNER_TEMP/ultttt-tracks.json" >/dev/null; then
            echo 'Version 9 is already recorded on the completed production track; no additional submission needed.'
            exit 0
          fi
          jq -n --arg name "$RELEASE_NAME" --arg notes "$RELEASE_NOTES" --arg version "$VERSION_CODE" \
            '{track:"production", releases:[{name:$name,versionCodes:[$version],status:"completed",releaseNotes:[{language:"en-US",text:$notes}]}]}' > "$RUNNER_TEMP/ultttt-production.json"
          curl --fail-with-body -sS -X PUT "$api/edits/$edit_id/tracks/production" -H "$auth" -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/ultttt-production.json" > "$RUNNER_TEMP/ultttt-track-result.json"
          jq -e 'any(.releases[]?; .status == "completed" and any(.versionCodes[]?; tostring == "9"))' "$RUNNER_TEMP/ultttt-track-result.json" >/dev/null
          curl --fail-with-body -sS -X POST "$api/edits/$edit_id:commit?changesNotSentForReview=false" -H "$auth" > "$RUNNER_TEMP/ultttt-commit.json"
          jq -e '.id != null' "$RUNNER_TEMP/ultttt-commit.json" >/dev/null
          edit_id=''
          echo 'GOOGLE_PLAY_PRODUCTION_SUBMITTED_VERSION_9=YES'
          echo 'Google accepted the production edit. Review and device availability are controlled by Google Play.'
