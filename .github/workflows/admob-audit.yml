name: AdMob API Audit

on:
  push:
    branches:
      - android-launch-console-setup-3
    paths:
      - .github/workflows/admob-audit.yml
      - Scripts/admob_audit.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-auth requests
      - name: Probe AdMob access
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: python Scripts/admob_audit.py
