name: StarRun Play Data safety (fast retry)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/starrun-play-data-safety-only.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: starrun-play-internal
  cancel-in-progress: false
jobs:
  safety:
    name: Submit StarRun ad-free Android Data safety
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify ad-free source and package
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.enabled == true and .source_sha == "674a98555feeb50c721eb77abd9ffcad74607e07"' .github/starrun-android-release-request.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: pip install --quiet requests
      - name: Authenticate Google Play
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Submit data safety (no Android ads, account, or network collection)
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python Scripts/configure_starrun_play_data_safety.py --submit
      - name: Preserve submitted Google questionnaire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starrun-data-safety-fast
          path: play-store-starrun/data-safety.csv
          if-no-files-found: warn
          retention-days: 30
