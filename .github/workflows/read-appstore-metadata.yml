name: Read App Store Metadata

on:
  push:
    branches: [main]
    paths: ['.github/workflows/read-appstore-metadata.yml']

jobs:
  read-metadata:
    runs-on: macos-15
    steps:
      - name: Read current App Store Connect metadata
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          key=~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          printf '%s' "$ASC_KEY_P8" | tr -d '\r' > "$key"
          if ! grep -q 'BEGIN' "$key" && grep -q '\\n' "$key"; then
            printf '%b' "$(cat "$key")" > "$key.tmp" && mv "$key.tmp" "$key"
          fi
          if ! grep -q 'BEGIN' "$key" && base64 -d < "$key" > "$key.tmp" 2>/dev/null; then
            if grep -q 'BEGIN' "$key.tmp"; then mv "$key.tmp" "$key"; else rm -f "$key.tmp"; fi
          fi
          if ! grep -q 'BEGIN' "$key"; then
            body=$(tr -d '\n\r ' < "$key")
            { echo '-----BEGIN PRIVATE KEY-----'; echo "$body" | fold -w 64; echo '-----END PRIVATE KEY-----'; } > "$key.tmp"
            mv "$key.tmp" "$key"
          fi
          chmod 600 "$key"

          TOKEN=$(ruby <<'RUBY'
          require 'openssl'
          require 'json'
          require 'base64'
          def b64url(s)
            Base64.urlsafe_encode64(s, padding: false)
          end
          now = Time.now.to_i
          header = b64url(JSON.generate({alg:'ES256', kid:ENV.fetch('ASC_KEY_ID'), typ:'JWT'}))
          payload = b64url(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'), iat:now, exp:now+600, aud:'appstoreconnect-v1'}))
          signing_input = "#{header}.#{payload}"
          key = OpenSSL::PKey.read(File.read(File.expand_path("~/private_keys/AuthKey_#{ENV.fetch('ASC_KEY_ID')}.p8")))
          digest = OpenSSL::Digest::SHA256.digest(signing_input)
          der = key.dsa_sign_asn1(digest)
          seq = OpenSSL::ASN1.decode(der)
          r = seq.value[0].value.to_i.to_s(16).rjust(64, '0')
          s = seq.value[1].value.to_i.to_s(16).rjust(64, '0')
          sig = [r + s].pack('H*')
          puts "#{signing_input}.#{b64url(sig)}"
          RUBY
          )

          api() { curl -fsS -H "Authorization: Bearer $TOKEN" "$1"; }

          apps=$(api 'https://api.appstoreconnect.apple.com/v1/apps?filter%5BbundleId%5D=com.rsm.eztrivia&limit=10')
          app_id=$(printf '%s' "$apps" | jq -r '.data[0].id // empty')
          if [ -z "$app_id" ]; then
            echo 'No app found for bundle id com.rsm.eztrivia'
            exit 1
          fi

          echo '=== APP ==='
          printf '%s' "$apps" | jq '{data: [.data[] | {id, attributes: {name: .attributes.name, bundleId: .attributes.bundleId, sku: .attributes.sku, primaryLocale: .attributes.primaryLocale}}]}'

          echo '=== APP INFO LOCALIZATIONS ==='
          infos=$(api "https://api.appstoreconnect.apple.com/v1/apps/$app_id/appInfos?limit=20")
          printf '%s' "$infos" | jq -r '.data[].id' | while read -r info_id; do
            api "https://api.appstoreconnect.apple.com/v1/appInfos/$info_id/appInfoLocalizations?limit=50" | jq '{data: [.data[] | {id, attributes}]}'
          done

          echo '=== APP STORE VERSIONS ==='
          versions=$(api "https://api.appstoreconnect.apple.com/v1/apps/$app_id/appStoreVersions?filter%5Bplatform%5D=IOS&limit=50")
          printf '%s' "$versions" | jq '{data: [.data[] | {id, attributes: {versionString: .attributes.versionString, appStoreState: .attributes.appStoreState, appVersionState: .attributes.appVersionState, createdDate: .attributes.createdDate, copyright: .attributes.copyright}}]}'

          echo '=== VERSION LOCALIZATIONS ==='
          printf '%s' "$versions" | jq -r '.data[] | [.id, .attributes.versionString, (.attributes.appStoreState // .attributes.appVersionState // "")] | @tsv' | while IFS=$'\t' read -r version_id version_string state; do
            echo "--- VERSION $version_string [$state] ---"
            api "https://api.appstoreconnect.apple.com/v1/appStoreVersions/$version_id/appStoreVersionLocalizations?limit=50" | jq '{data: [.data[] | {id, attributes: {locale: .attributes.locale, description: .attributes.description, keywords: .attributes.keywords, marketingUrl: .attributes.marketingUrl, promotionalText: .attributes.promotionalText, supportUrl: .attributes.supportUrl, whatsNew: .attributes.whatsNew}}]}'
          done
