name: Check TestFlight status

# Read-only diagnostic: asks App Store Connect directly why a build isn't
# visible in TestFlight, instead of guessing. Runs on ubuntu-latest -- this
# only needs curl and the API key, not a macOS toolchain.
#
# Uses the same four secrets as testflight.yml. Prints build processing
# state, beta group membership, and internal tester counts. Never prints
# secret contents.

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets are present
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ]    || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ]    || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      # Same normalisation as testflight.yml, since people paste .p8 secrets
      # in every possible shape.
      - name: Normalise the API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -u
          mkdir -p ~/private_keys
          key=~/private_keys/AuthKey_${ASC_KEY_ID}.p8

          printf '%s' "$ASC_KEY_P8" | tr -d '\r' > "$key"
          if ! grep -q 'BEGIN' "$key" && grep -q '\\n' "$key"; then
            printf '%b' "$(cat "$key")" > "$key.tmp" && mv "$key.tmp" "$key"
          fi
          if ! grep -q 'BEGIN' "$key" && base64 -d < "$key" > "$key.tmp" 2>/dev/null; then
            if grep -q 'BEGIN' "$key.tmp"; then mv "$key.tmp" "$key"; else rm -f "$key.tmp"; fi
          fi
          if ! grep -q 'BEGIN' "$key"; then
            body=$(tr -d '\n\r ' < "$key")
            { echo "-----BEGIN PRIVATE KEY-----"
              echo "$body" | fold -w 64
              echo "-----END PRIVATE KEY-----"; } > "$key.tmp" && mv "$key.tmp" "$key"
          fi
          chmod 600 "$key"

          if ! openssl pkey -in "$key" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 does not parse as a private key."
            exit 1
          fi
          echo "API key parses."

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet "pyjwt[crypto]" requests

      - name: Query App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: com.rsm.eztrivia
        run: |
          python3 <<'PYEOF'
          import os, time, json, sys
          import jwt
          import requests

          key_id = os.environ["ASC_KEY_ID"]
          issuer_id = os.environ["ASC_ISSUER_ID"]
          bundle_id = os.environ["BUNDLE_ID"]
          key_path = os.path.expanduser(f"~/private_keys/AuthKey_{key_id}.p8")

          with open(key_path) as f:
              private_key = f.read()

          now = int(time.time())
          token = jwt.encode(
              {"iss": issuer_id, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"},
              private_key,
              algorithm="ES256",
              headers={"kid": key_id},
          )
          headers = {"Authorization": f"Bearer {token}"}
          base = "https://api.appstoreconnect.apple.com/v1"

          def get(path, **params):
              r = requests.get(f"{base}{path}", headers=headers, params=params, timeout=30)
              if r.status_code >= 300:
                  print(f"::error::{path} -> HTTP {r.status_code}: {r.text[:500]}")
                  sys.exit(1)
              return r.json()

          apps = get("/apps", **{"filter[bundleId]": bundle_id})
          if not apps.get("data"):
              print(f"No app found in App Store Connect for bundle ID {bundle_id}.")
              print("The app record may not exist yet, or this API key's team doesn't match.")
              sys.exit(0)
          app = apps["data"][0]
          app_id = app["id"]
          print(f"App: {app['attributes'].get('name')} ({bundle_id}), id={app_id}")
          print()

          # The nested /apps/{id}/builds relationship endpoint rejects `sort`
          # (PARAMETER_ERROR.ILLEGAL). Query the top-level /builds collection
          # with a filter instead, which does support it.
          builds = get(
              "/builds",
              **{
                  "filter[app]": app_id,
                  "sort": "-uploadedDate",
                  "limit": 5,
                  "fields[builds]": "version,processingState,uploadedDate,expired,minOsVersion",
              },
          )
          print(f"Builds (newest {len(builds.get('data', []))} shown):")
          if not builds.get("data"):
              print("  (none -- App Store Connect has no builds for this app at all)")
          for b in builds.get("data", []):
              a = b["attributes"]
              print(f"  build {a.get('version')}: state={a.get('processingState')}"
                    f" uploaded={a.get('uploadedDate')} expired={a.get('expired')}"
                    f" minOS={a.get('minOsVersion')}")
          print()

          # --- Game Center -------------------------------------------------
          # "Your app's first leaderboard must be submitted with a Game
          # Center-enabled app version" has several possible causes. Report the
          # three pieces of state that distinguish them instead of guessing:
          # whether the App ID carries the capability, whether App Store Connect
          # has a Game Center configuration for the app, and whether any app
          # version has Game Center switched on.
          print("=== Game Center ===")

          bundles = get("/bundleIds", **{"filter[identifier]": bundle_id,
                                         "fields[bundleIds]": "identifier,name"})
          if bundles.get("data"):
              bundle_ref = bundles["data"][0]
              caps = get(f"/bundleIds/{bundle_ref['id']}/bundleIdCapabilities",
                         **{"fields[bundleIdCapabilities]": "capabilityType"})
              types = sorted(
                  c["attributes"].get("capabilityType") or "(unnamed)"
                  for c in caps.get("data", [])
              )
              print(f"App ID capabilities ({len(types)}): {', '.join(types) or '(none)'}")
              print("  GAME_CENTER enabled on the App ID: "
                    f"{'YES' if 'GAME_CENTER' in types else 'NO'}")
          else:
              print("App ID not visible to this API key "
                    "(the key may lack Certificates/Identifiers access).")

          r = requests.get(f"{base}/apps/{app_id}/gameCenterDetail",
                           headers=headers, timeout=30)
          if r.status_code == 200 and (r.json() or {}).get("data"):
              gc = r.json()["data"]
              print(f"App Store Connect gameCenterDetail: EXISTS (id={gc['id']})")
              boards = get(f"/gameCenterDetails/{gc['id']}/gameCenterLeaderboards")
              print(f"Leaderboards: {len(boards.get('data', []))}")
              for b in boards.get("data", []):
                  a = b.get("attributes", {})
                  extra = {k: v for k, v in a.items()
                           if k not in {"referenceName", "vendorIdentifier"}}
                  print(f"  {a.get('vendorIdentifier')}: {a.get('referenceName')}")
                  print(f"      {extra}")
          else:
              print(f"App Store Connect gameCenterDetail: MISSING (HTTP {r.status_code})")
              print("  Nothing can reference a leaderboard until this exists.")

          # Nested relationship endpoints reject `sort` (PARAMETER_ERROR.ILLEGAL),
          # the same way /apps/{id}/builds did. Take the default order.
          versions = get(f"/apps/{app_id}/appStoreVersions",
                         **{"limit": 5,
                            "fields[appStoreVersions]": "versionString,appStoreState,platform,createdDate"})
          print(f"App Store versions ({len(versions.get('data', []))} newest):")
          for v in versions.get("data", []):
              a = v["attributes"]
              vid = v["id"]
              gce = requests.get(f"{base}/appStoreVersions/{vid}/gameCenterAppVersion",
                                 headers=headers, timeout=30)
              if gce.status_code == 200 and (gce.json() or {}).get("data"):
                  attrs = gce.json()["data"].get("attributes", {})
                  gc_state = f"ENABLED (enabled={attrs.get('enabled')})"
              else:
                  gc_state = f"not enabled (HTTP {gce.status_code})"
              print(f"  {a.get('versionString')} [{a.get('appStoreState')}] "
                    f"Game Center: {gc_state}")
          print()

          # --- Store listing ------------------------------------------------
          # Verifying what is actually saved in App Store Connect, rather than
          # trusting that a paste landed. Every one of these is required before
          # a version can be submitted, and an empty field here is the whole
          # reason a submission gets blocked.
          print("=== Store listing ===")

          infos = get(f"/apps/{app_id}/appInfos", **{"limit": 5})
          for info in infos.get("data", []):
              locs = get(f"/appInfos/{info['id']}/appInfoLocalizations",
                         **{"fields[appInfoLocalizations]":
                            "locale,name,subtitle,privacyPolicyUrl"})
              for loc in locs.get("data", []):
                  a = loc["attributes"]
                  if not a.get("name") and not a.get("subtitle"):
                      continue
                  print(f"  [{a.get('locale')}]")
                  print(f"    name:     {a.get('name') or '(EMPTY)'}")
                  print(f"    subtitle: {a.get('subtitle') or '(EMPTY)'}")
                  print(f"    privacy:  {a.get('privacyPolicyUrl') or '(EMPTY)'}")

          for v in versions.get("data", []):
              vlocs = get(f"/appStoreVersions/{v['id']}/appStoreVersionLocalizations",
                          **{"fields[appStoreVersionLocalizations]":
                             "locale,description,keywords,promotionalText,supportUrl,marketingUrl,whatsNew"})
              for loc in vlocs.get("data", []):
                  a = loc["attributes"]
                  desc = (a.get("description") or "").strip()
                  print(f"  [{v['attributes'].get('versionString')} / {a.get('locale')}]")
                  print(f"    description:  {len(desc)} chars"
                        + (f" -- starts: {desc[:60]}..." if desc else " (EMPTY)"))
                  print(f"    keywords:     {a.get('keywords') or '(EMPTY)'}")
                  print(f"    promo text:   {a.get('promotionalText') or '(EMPTY)'}")
                  print(f"    support URL:  {a.get('supportUrl') or '(EMPTY)'}")
                  print(f"    marketing URL:{a.get('marketingUrl') or '(none, optional)'}")

              # Screenshots are the one required asset that cannot be pasted,
              # so report per display size how many are actually uploaded.
              sets = get(f"/appStoreVersions/{v['id']}/appStoreVersionLocalizations",
                         **{"fields[appStoreVersionLocalizations]": "locale"})
              for loc in sets.get("data", []):
                  shots = get(f"/appStoreVersionLocalizations/{loc['id']}/appScreenshotSets",
                              **{"fields[appScreenshotSets]": "screenshotDisplayType"})
                  if not shots.get("data"):
                      print(f"    screenshots:  NONE uploaded")
                      continue
                  for st in shots.get("data", []):
                      kind = st["attributes"].get("screenshotDisplayType")
                      imgs = get(f"/appScreenshotSets/{st['id']}/appScreenshots",
                                 **{"fields[appScreenshots]": "assetDeliveryState"})
                      print(f"    screenshots:  {kind}: {len(imgs.get('data', []))}")
          print()

          groups = get(
              f"/apps/{app_id}/betaGroups",
              **{"fields[betaGroups]": "name,isInternalGroup,publicLinkEnabled"},
          )
          print(f"Beta groups: {len(groups.get('data', []))}")
          if not groups.get("data"):
              print("  (none -- no TestFlight group exists yet, internal or external)")
              print("  This is almost certainly why nothing shows up: a build can finish")
              print("  processing successfully and still be invisible until it is added")
              print("  to a group that includes you as a tester.")
          for g in groups.get("data", []):
              ga = g["attributes"]
              kind = "internal" if ga.get("isInternalGroup") else "external"
              testers = get(f"/betaGroups/{g['id']}/betaTesters", **{"fields[betaTesters]": "email,inviteType,state"})
              tester_count = len(testers.get("data", []))
              print(f"  '{ga.get('name')}' ({kind}), {tester_count} tester(s)")
              for t in testers.get("data", []):
                  ta = t["attributes"]
                  print(f"    - {ta.get('email')}: {ta.get('inviteType')}/{ta.get('state')}")
          PYEOF
