name: "Android v12 Internal — Play Console SDK and native symbols"

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/android-v12-internal-play-console-advisories.yml"

permissions:
  contents: read

concurrency:
  group: android-v12-internal-live-fixes
  cancel-in-progress: false

jobs:
  rollout:
    name: Build and verify v12 for Internal Testing only
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PACKAGE_NAME: com.rsm.eztrivia
      CLOSED_TRACK: production-access
      VERSION_CODE: "12"
      VERSION_NAME: 1.0.0-alpha12
      RELEASE_NOTES: 'Android compatibility and stability improvements; smoother gameplay and reliable leaderboards.'
      ANDROID_ADMOB_APP_ID: ca-app-pub-1217971050094766~1085041409
      ANDROID_ADMOB_BANNER_ID: ca-app-pub-1217971050094766/1190439457

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Validate release configuration and credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$PLAY_SERVICE_ACCOUNT"
          [[ "$ANDROID_ADMOB_APP_ID" =~ ^ca-app-pub-1217971050094766~[0-9]+$ ]]
          [[ "$ANDROID_ADMOB_BANNER_ID" =~ ^ca-app-pub-1217971050094766/[0-9]+$ ]]

      - name: Require both approved Play Games and Billing fixes before releasing v12
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/src/main/java/com/rsm/eztrivia/playgames/PlayGamesLeaderboardErrors.kt
          test -s android/app/src/main/java/com/rsm/eztrivia/ui/PlayGamesLeaderboardsScreen.kt
          test -s android/app/src/main/java/com/rsm/eztrivia/billing/BillingConnectionMessages.kt
          grep -q 'personalRankUnavailable' android/app/src/main/java/com/rsm/eztrivia/playgames/PlayGamesManager.kt
          grep -q 'CONNECTION_TIMEOUT_MILLIS = 15_000L' android/app/src/main/java/com/rsm/eztrivia/billing/RemoveAdsBillingManager.kt
          grep -q 'BillingConnectionMessages.disconnected()' android/app/src/main/java/com/rsm/eztrivia/billing/RemoveAdsBillingManager.kt
          grep -Fq 'removeAdsBillingManager.start()' android/app/src/main/java/com/rsm/eztrivia/MainActivity.kt
          grep -Fq 'finishConnection()' android/app/src/main/java/com/rsm/eztrivia/billing/RemoveAdsBillingManager.kt
          echo "PR #173 leaderboard and PRs #174/#176 billing fixes present; build can proceed."

      - name: Authenticate to Google Play Developer API
        id: play_auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Guard known Production release and v11 Internal before uploading v12
        env:
          ACCESS_TOKEN: ${{ steps.play_auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${PACKAGE_NAME}/tracks"
          auth=(-H "Authorization: Bearer ${ACCESS_TOKEN}" -H "Accept: application/json")
          curl --fail-with-body --silent --show-error "${base}/${CLOSED_TRACK}/releases" "${auth[@]}" > "$RUNNER_TEMP/closed-before.json"
          curl --fail-with-body --silent --show-error "${base}/internal/releases" "${auth[@]}" > "$RUNNER_TEMP/internal-before.json"
          curl --fail-with-body --silent --show-error "${base}/production/releases" "${auth[@]}" > "$RUNNER_TEMP/production-before.json"

          has_published_version() {
            local file="$1" version="$2"
            jq -e --argjson v "$version" '
              any(.releases[]?; .releaseLifecycleState == "RELEASE_LIFECYCLE_STATE_PUBLISHED" and
                any(.activeArtifacts[]?.versionCode; (. | tonumber) == $v))
            ' "$file" >/dev/null
          }
          has_any_version() {
            local file="$1" version="$2"
            jq -e --argjson v "$version" '
              any(.releases[]?; any(.activeArtifacts[]?.versionCode; (. | tonumber) == $v))
            ' "$file" >/dev/null
          }

          # Production might still be v9 or have been manually promoted to v11.
          # Preserve whichever known release is live; never edit Production.
          if ! has_published_version "$RUNNER_TEMP/production-before.json" 9 &&
             ! has_published_version "$RUNNER_TEMP/production-before.json" 11; then
            echo "::error::Expected published Production v9 or v11. Refusing a changed/unknown Play state."
            exit 2
          fi
          if ! has_published_version "$RUNNER_TEMP/internal-before.json" 11; then
            echo "::error::Existing Internal Testing v11 is missing. Refusing to replace an unknown track."
            exit 3
          fi
          # After an app is publicly released, Google's closed-test track can
          # have no current release and may return an empty body. Do not require
          # an obsolete v8 to remain published, and NEVER edit the closed track.
          # We still reject unexpected nonempty/malformed responses.
          if [ -s "$RUNNER_TEMP/closed-before.json" ] && ! jq -e . "$RUNNER_TEMP/closed-before.json" >/dev/null 2>&1; then
            echo "::error::Closed-testing track returned invalid JSON. Refusing v12 upload."
            exit 4
          fi
          for file in "$RUNNER_TEMP/internal-before.json" "$RUNNER_TEMP/production-before.json"; do
            if has_any_version "$file" 12; then
              echo "::error::v12 already exists in Google Play track data. Refusing duplicate upload."
              exit 5
            fi
          done
          if [ -s "$RUNNER_TEMP/closed-before.json" ] && has_any_version "$RUNNER_TEMP/closed-before.json" 12; then
            echo "::error::v12 unexpectedly exists in closed testing. Refusing duplicate upload."
            exit 5
          fi
          echo "Known Production release and v11 Internal verified, v12 absent, closed testing untouched. Internal-only upload may proceed."

      - name: Refuse to interrupt an existing Google Play review
        env:
          ACCESS_TOKEN: ${{ steps.play_auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${PACKAGE_NAME}"
          auth=(-H "Authorization: Bearer ${ACCESS_TOKEN}" -H "Content-Type: application/json")
          edit_json="$(curl --fail-with-body --silent --show-error -X POST "${base}/edits" "${auth[@]}" -d '{}')"
          edit_id="$(jq -r '.id' <<<"$edit_json")"
          test -n "$edit_id" && test "$edit_id" != "null"
          code="$(curl --silent --show-error -o "$RUNNER_TEMP/parity-review-probe.json" -w '%{http_code}' -X POST "${base}/edits/${edit_id}:commit?changesInReviewBehavior=ERROR_IF_IN_REVIEW" "${auth[@]}" -d '{}')"
          if [ "$code" != "200" ]; then
            curl --silent --show-error -X DELETE "${base}/edits/${edit_id}" "${auth[@]}" >/dev/null || true
            echo "::error::Google Play review probe blocked with HTTP ${code}. No release will be uploaded."
            cat "$RUNNER_TEMP/parity-review-probe.json"
            exit 5
          fi
          echo "No changes currently in review; Internal-only v12 release can proceed."

      - name: Require active Remove Ads inventory before uploading
        env:
          ACCESS_TOKEN: ${{ steps.play_auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME/oneTimeProducts/com.rsm.eztrivia.removeads"
          status="$(curl --silent --show-error -o "$RUNNER_TEMP/remove-ads-inventory.json" -w '%{http_code}' -H "Authorization: Bearer $ACCESS_TOKEN" -H "Accept: application/json" "$url")"
          if [ "$status" != "200" ]; then
            echo "::error::Could not verify active Remove Ads product (HTTP $status). Refusing v12 upload."
            exit 9
          fi
          jq -r '.purchaseOptions[]? | "Remove Ads purchase option: id=\(.purchaseOptionId) state=\(.state) availableRegions=\([.regionalPricingAndAvailabilityConfigs[]? | select(.availability == "AVAILABLE")] | length) USAvailability=\([.regionalPricingAndAvailabilityConfigs[]? | select(.regionCode == "US")][0].availability // "unknown") USPrice=\([.regionalPricingAndAvailabilityConfigs[]? | select(.regionCode == "US")][0].price // {})"' "$RUNNER_TEMP/remove-ads-inventory.json"
          active="$(jq -r '[.purchaseOptions[]? | select(.state == "ACTIVE")] | length' "$RUNNER_TEMP/remove-ads-inventory.json")"
          if [ "$active" -lt 1 ]; then
            echo "::error::Remove Ads has no active purchase options. Refusing v12 upload."
            exit 9
          fi

      - name: Require all Play Games achievement and leaderboard resources published
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.play_auth.outputs.access_token }}
          PLAY_GAMES_AUDIT_OUTPUT: ${{ runner.temp }}/v12-play-games-audit.json
        run: python Scripts/audit_play_games.py

      - name: Verify published Play Games metadata before testing release
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/v12-play-games-audit.json"
          test -s "$file"
          achievements="$(jq -r '.achievements.publishedMetadataCount' "$file")"
          leaderboards="$(jq -r '.leaderboards.publishedMetadataCount' "$file")"
          echo "Live Play Games achievements: $achievements / 19"
          echo "Live Play Games leaderboards: $leaderboards / 17"
          if [ "$achievements" != "19" ] || [ "$leaderboards" != "17" ]; then
            echo "::error::Google Play Games project is not fully published. No Android upload."
            exit 8
          fi

      - name: Authenticate to Firebase Management API
        id: firebase_auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false

      - name: Materialize required Firebase Android config
        env:
          ACCESS_TOKEN: ${{ steps.firebase_auth.outputs.access_token }}
          SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          project_id="$(jq -r '.project_id // empty' <<<"$SERVICE_ACCOUNT")"
          test -n "$project_id"
          auth=(-H "Authorization: Bearer ${ACCESS_TOKEN}" -H "Accept: application/json")
          base="https://firebase.googleapis.com/v1beta1"

          apps="$(curl --fail-with-body --silent --show-error "${base}/projects/${project_id}/androidApps" "${auth[@]}")"
          app_name="$(jq -r '[.apps[]? | select(.packageName == "com.rsm.eztrivia") | .name] | first // empty' <<<"$apps")"
          if [[ -z "$app_name" ]]; then
            echo "::error::Firebase Android app com.rsm.eztrivia is missing; refusing v12 release without Crashlytics."
            exit 10
          fi

          config="$(curl --fail-with-body --silent --show-error "${base}/${app_name}/config" "${auth[@]}")"
          jq -r '.configFileContents' <<<"$config" | base64 --decode > android/app/google-services.json
          jq -e '
            any(.client[]?;
              .client_info.android_client_info.package_name == "com.rsm.eztrivia" and
              (.client_info.mobilesdk_app_id | type == "string" and length > 0)
            )
          ' android/app/google-services.json >/dev/null

      - name: Assert Firebase Analytics is absent
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:dependencies --configuration releaseRuntimeClasspath > "$RUNNER_TEMP/release-runtime-deps.txt"
          if grep -Eq 'com\.google\.firebase:firebase-analytics([:-]|$)' "$RUNNER_TEMP/release-runtime-deps.txt"; then
            echo "::error::Firebase Analytics entered the release graph; refusing v12."
            grep 'com.google.firebase:firebase-analytics' "$RUNNER_TEMP/release-runtime-deps.txt" || true
            exit 11
          fi

      - name: Materialize upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/eztrivia-upload.p12"
          keytool -list             -keystore "$RUNNER_TEMP/eztrivia-upload.p12"             -storetype PKCS12             -storepass "$KEYSTORE_PASSWORD"             -alias upload >/dev/null
          chmod 600 "$RUNNER_TEMP/eztrivia-upload.p12"

      - name: Audit AndroidX Fragment runtime dependency (Play SDK advisory)
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android :app:dependencyInsight --dependency androidx.fragment:fragment --configuration releaseRuntimeClasspath --console=plain \
            | tee "$RUNNER_TEMP/v12-fragment-resolution.txt"
          if grep -Fq 'androidx.fragment:fragment:' "$RUNNER_TEMP/v12-fragment-resolution.txt"; then
            grep -Fq 'androidx.fragment:fragment:1.9.1' "$RUNNER_TEMP/v12-fragment-resolution.txt" || {
              echo "::error::Expected updated androidx.fragment:fragment 1.9.1 in release runtime."
              exit 1
            }
          fi

      - name: Guard supported edge-to-edge paths (Play Android 15/16 advisories)
        shell: bash
        run: |
          set -euo pipefail
          for activity in MainActivity DailyChallengeActivity FriendChallengeActivity; do
            file="android/app/src/main/java/com/rsm/eztrivia/${activity}.kt"
            grep -Fq 'enableEdgeToEdge()' "$file"
            grep -Fq 'safeDrawingPadding()' "$file"
          done
          test "$(grep -Fc 'android:windowSoftInputMode="adjustResize"' android/app/src/main/AndroidManifest.xml)" -eq 3
          if grep -RnE '(setStatusBarColor|setNavigationBarColor|statusBarColor|navigationBarColor)' android/app/src/main/java/com/rsm/eztrivia; then
            echo "::error::First-party Android code calls a deprecated system-bar-color API."
            exit 1
          fi

      - name: Run Android unit tests
        working-directory: android
        run: gradle testDebugUnitTest --stacktrace

      - name: Build signed production-configured v12 bundle
        working-directory: android
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/eztrivia-upload.p12
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          EZTRIVIA_VERSION_CODE: ${{ env.VERSION_CODE }}
          EZTRIVIA_VERSION_NAME: ${{ env.VERSION_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          gradle bundleRelease --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Verify bundle signature
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
      - name: Prepare matching native debug symbols for Play
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/prepare_native_symbols.py \
            --aab android/app/build/outputs/bundle/release/app-release.aab \
            --intermediates android/app/build/intermediates \
            --out "$RUNNER_TEMP/v12-native-debug-symbols.zip" \
            --report "$RUNNER_TEMP/v12-native-symbols-report.json"
          test -s "$RUNNER_TEMP/v12-native-debug-symbols.zip"
          python3 - "$RUNNER_TEMP/v12-native-symbols-report.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          assert data["symbol_count"] > 0, "No authentic native symbols available"
          if data["unavailable_count"]:
              print(f"Some third-party libraries are pre-stripped: {data['unavailable_count']}; provider debug files are unavailable")
          PY
          unzip -l "$RUNNER_TEMP/v12-native-debug-symbols.zip"

      - name: Inspect signed App Bundle native symbol metadata
        shell: bash
        run: |
          set -euo pipefail
          unzip -Z -1 android/app/build/outputs/bundle/release/app-release.aab \
            | grep -E '(^base/lib/.*\.so$|^BUNDLE-METADATA/.*debugsymbol)' \
            | tee "$RUNNER_TEMP/v12-aab-native-contents.txt"
          echo "A separate ZIP containing matching available symbols will be uploaded with this AAB."


      - name: Prepare Play release notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/play-notes"
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/play-notes/whatsnew-en-US"

      - name: Publish v12 to existing Google Play Internal Testing
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.rsm.eztrivia
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          releaseName: EZ Trivia 1.0.0-alpha12 (v12)
          whatsNewDirectory: ${{ runner.temp }}/play-notes
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          debugSymbols: ${{ runner.temp }}/v12-native-debug-symbols.zip

      - name: Verify v12 is available on the existing Internal Testing track
        env:
          ACCESS_TOKEN: ${{ steps.play_auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME/tracks/internal/releases"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $ACCESS_TOKEN" -H "Accept: application/json" \
            "$url" > "$RUNNER_TEMP/internal-after.json"
          jq -r '.releases[]? | "internal release=\(.releaseName) versionCodes=\([.activeArtifacts[]?.versionCode] | join(",")) lifecycle=\(.releaseLifecycleState)"' "$RUNNER_TEMP/internal-after.json"
          jq -e 'any(.releases[]?; .releaseLifecycleState == "RELEASE_LIFECYCLE_STATE_PUBLISHED" and any(.activeArtifacts[]?.versionCode; (. | tonumber) == 12))' \
            "$RUNNER_TEMP/internal-after.json" >/dev/null
          echo "v12 was published to Internal Testing. Closed testing and Production remain untouched."

      - name: Archive v12 Internal-only release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eztrivia-v12-internal-evidence
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
            ${{ runner.temp }}/internal-before.json
            ${{ runner.temp }}/production-before.json
            ${{ runner.temp }}/closed-before.json
            ${{ runner.temp }}/internal-after.json
            ${{ runner.temp }}/remove-ads-inventory.json
            ${{ runner.temp }}/v12-play-games-audit.json
            ${{ runner.temp }}/v12-native-debug-symbols.zip
            ${{ runner.temp }}/v12-native-symbols-report.json
            ${{ runner.temp }}/v12-aab-native-contents.txt
            ${{ runner.temp }}/v12-fragment-resolution.txt
          if-no-files-found: warn
          retention-days: 30
