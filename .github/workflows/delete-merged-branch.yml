name: Delete merged branches

# Branch cleanup, handled by the repo rather than remembered by a person.
#
# Two ways in:
#   * a merged pull request deletes its own head branch
#   * a manual sweep clears anything already merged that got left behind
#
# Both paths refuse to delete a branch that is not an ancestor of the default
# branch, so unmerged work is never at risk here, and main is refused outright.
#
# GitHub can do the first half of this natively -- Settings > General >
# "Automatically delete head branches". If that gets switched on, the
# pull_request trigger below becomes redundant and can be dropped; the manual
# sweep is still worth keeping for strays.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting it"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  on-merge:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete the head branch
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$SAME_REPO" != "true" ]; then
            echo "Head is on a fork; nothing to delete."; exit 0
          fi
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "Refusing to delete the default branch."; exit 0
          fi
          if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" 2>/dev/null; then
            echo "Deleted $BRANCH"
          else
            echo "$BRANCH was already gone."
          fi

  sweep:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete every branch already merged into the default branch
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # checkout only guarantees the ref it checked out, so the full set is
          # fetched explicitly rather than assumed to be present. Without this
          # the loop iterates over nothing and reports a clean sweep having
          # looked at no branches, which is the worst possible way to be wrong.
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          # A squash merge rewrites the branch's commits into one new commit on
          # the default branch, so a squash-merged branch is never an ancestor
          # of it. Ancestry alone therefore reports every squash-merged branch
          # as unmerged -- which is how the first version of this decided the
          # branch it was written to clean up should be kept. GitHub knows the
          # truth, so ask it, and keep ancestry as the fallback for branches
          # that were merged without a pull request.
          merged_heads=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls?state=closed&per_page=100" \
            --jq '.[] | select(.merged_at != null) | .head.ref' | sort -u)

          mapfile -t refs < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin)
          echo "Examining ${#refs[@]} remote branches against $DEFAULT_BRANCH"

          deleted=0
          kept=0
          for ref in "${refs[@]}"; do
            if [ "$ref" = "HEAD" ] || [ "$ref" = "$DEFAULT_BRANCH" ]; then
              continue
            fi
            reason=""
            if grep -qxF "$ref" <<<"$merged_heads"; then
              reason="merged pull request"
            elif git merge-base --is-ancestor "origin/$ref" "origin/$DEFAULT_BRANCH"; then
              reason="ancestor of $DEFAULT_BRANCH"
            fi
            if [ -z "$reason" ]; then
              echo "  keeping        $ref (no merged PR, not an ancestor)"
              kept=$((kept+1))
              continue
            fi
            sha=$(git rev-parse "origin/$ref")
            echo "  ($reason)"
            if [ "$DRY_RUN" = "true" ]; then
              echo "  would delete   $ref  $sha"
            else
              git push origin --delete "$ref"
              echo "  deleted        $ref  $sha"
            fi
            deleted=$((deleted+1))
          done

          echo
          echo "$deleted merged, $kept still unmerged."
          echo "Restore any with: git push origin <sha>:refs/heads/<branch>"
