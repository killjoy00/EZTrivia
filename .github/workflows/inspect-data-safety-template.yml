name: Inspect Data Safety Template

on:
  push:
    branches:
      - android-launch-console-setup-3
    paths:
      - .github/workflows/inspect-data-safety-template.yml
      - Scripts/inspect_data_safety_template.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - run: python Scripts/inspect_data_safety_template.py
