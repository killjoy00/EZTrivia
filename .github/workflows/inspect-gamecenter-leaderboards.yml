name: Stage Video Games Leaderboard Review

on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-gamecenter-leaderboards.yml']

jobs:
  stage:
    runs-on: macos-15
    steps:
      - name: Add Video Games leaderboard to draft review submission
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          key=~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          printf '%s' "$ASC_KEY_P8" | tr -d '\r' > "$key"
          if ! grep -q 'BEGIN' "$key" && grep -q '\\n' "$key"; then printf '%b' "$(cat "$key")" > "$key.tmp" && mv "$key.tmp" "$key"; fi
          if ! grep -q 'BEGIN' "$key" && base64 -d < "$key" > "$key.tmp" 2>/dev/null; then if grep -q 'BEGIN' "$key.tmp"; then mv "$key.tmp" "$key"; else rm -f "$key.tmp"; fi; fi
          if ! grep -q 'BEGIN' "$key"; then body=$(tr -d '\n\r ' < "$key"); { echo '-----BEGIN PRIVATE KEY-----'; echo "$body" | fold -w 64; echo '-----END PRIVATE KEY-----'; } > "$key.tmp"; mv "$key.tmp" "$key"; fi
          chmod 600 "$key"
          TOKEN=$(ruby <<'RUBY'
          require 'openssl'; require 'json'; require 'base64'
          def b64url(s); Base64.urlsafe_encode64(s, padding: false); end
          now=Time.now.to_i
          h=b64url(JSON.generate({alg:'ES256',kid:ENV.fetch('ASC_KEY_ID'),typ:'JWT'}))
          p=b64url(JSON.generate({iss:ENV.fetch('ASC_ISSUER_ID'),iat:now,exp:now+600,aud:'appstoreconnect-v1'}))
          input="#{h}.#{p}"
          key=OpenSSL::PKey.read(File.read(File.expand_path("~/private_keys/AuthKey_#{ENV.fetch('ASC_KEY_ID')}.p8")))
          der=key.dsa_sign_asn1(OpenSSL::Digest::SHA256.digest(input)); seq=OpenSSL::ASN1.decode(der)
          r=seq.value[0].value.to_i.to_s(16).rjust(64,'0'); s=seq.value[1].value.to_i.to_s(16).rjust(64,'0')
          puts "#{input}.#{b64url([r+s].pack('H*'))}"
          RUBY
          )
          get() { curl -fsS -H "Authorization: Bearer $TOKEN" "$1"; }
          post() {
            url="$1"; payload="$2"; tmp=$(mktemp)
            code=$(curl -sS -o "$tmp" -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data "$payload" "$url")
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then echo "POST_FAILED HTTP $code $url" >&2; cat "$tmp" >&2; rm -f "$tmp"; return 1; fi
            cat "$tmp"; rm -f "$tmp"
          }

          app_id=$(get 'https://api.appstoreconnect.apple.com/v1/apps?filter%5BbundleId%5D=com.rsm.eztrivia&limit=10' | jq -r '.data[0].id')
          app_version_id=$(get "https://api.appstoreconnect.apple.com/v1/apps/$app_id/appStoreVersions?filter%5Bplatform%5D=IOS&limit=50" | jq -r '.data[] | select(.attributes.versionString=="1.1.2") | .id' | head -1)
          detail=$(get "https://api.appstoreconnect.apple.com/v1/apps/$app_id/gameCenterDetail?include=gameCenterLeaderboards&limit%5BgameCenterLeaderboards%5D=50")
          video_id=$(printf '%s' "$detail" | jq -r '.included[] | select(.type=="gameCenterLeaderboards" and .attributes.vendorIdentifier=="EZTrivia.videoGames") | .id')
          video_version_id=$(get "https://api.appstoreconnect.apple.com/v2/gameCenterLeaderboards/$video_id/versions?limit=50" | jq -r '.data[] | select(.attributes.version==1) | .id' | head -1)
          [ -n "$video_version_id" ] || { echo 'Video Games leaderboard version not found'; exit 1; }

          submissions=$(get "https://api.appstoreconnect.apple.com/v1/apps/$app_id/reviewSubmissions?limit=20")
          submission_id=$(printf '%s' "$submissions" | jq -r '.data[] | select(.attributes.state=="READY_FOR_REVIEW") | .id' | head -1)
          if [ -z "$submission_id" ]; then
            payload=$(jq -n --arg app "$app_id" '{data:{type:"reviewSubmissions",attributes:{platform:"IOS"},relationships:{app:{data:{type:"apps",id:$app}}}}}')
            created=$(post 'https://api.appstoreconnect.apple.com/v1/reviewSubmissions' "$payload")
            submission_id=$(printf '%s' "$created" | jq -r '.data.id')
            echo "Created draft review submission $submission_id"
          else
            echo "Using existing draft review submission $submission_id"
          fi

          items=$(get "https://api.appstoreconnect.apple.com/v1/reviewSubmissions/$submission_id/items?include=appStoreVersion,gameCenterLeaderboardVersion&limit=200")
          if ! printf '%s' "$items" | jq -e --arg id "$video_version_id" '.included[]? | select(.type=="gameCenterLeaderboardVersions" and .id==$id)' >/dev/null; then
            payload=$(jq -n --arg sub "$submission_id" --arg version "$video_version_id" '{data:{type:"reviewSubmissionItems",relationships:{reviewSubmission:{data:{type:"reviewSubmissions",id:$sub}},gameCenterLeaderboardVersion:{data:{type:"gameCenterLeaderboardVersions",id:$version}}}}}')
            post 'https://api.appstoreconnect.apple.com/v1/reviewSubmissionItems' "$payload" >/dev/null
            echo "Added Video Games leaderboard version $video_version_id to draft"
          else
            echo 'Video Games leaderboard is already in the draft'
          fi

          # Keep the app release and its new Game Center component together when Apple permits it.
          items=$(get "https://api.appstoreconnect.apple.com/v1/reviewSubmissions/$submission_id/items?include=appStoreVersion,gameCenterLeaderboardVersion&limit=200")
          if [ -n "$app_version_id" ] && ! printf '%s' "$items" | jq -e --arg id "$app_version_id" '.included[]? | select(.type=="appStoreVersions" and .id==$id)' >/dev/null; then
            payload=$(jq -n --arg sub "$submission_id" --arg version "$app_version_id" '{data:{type:"reviewSubmissionItems",relationships:{reviewSubmission:{data:{type:"reviewSubmissions",id:$sub}},appStoreVersion:{data:{type:"appStoreVersions",id:$version}}}}}')
            if post 'https://api.appstoreconnect.apple.com/v1/reviewSubmissionItems' "$payload" >/dev/null; then
              echo 'Added App Store version 1.1.2 to the same draft'
            else
              echo 'App Store version 1.1.2 could not yet be added; Video Games leaderboard remains staged in the draft.'
            fi
          fi

          echo '=== REVIEW SUBMISSION ==='
          get "https://api.appstoreconnect.apple.com/v1/reviewSubmissions/$submission_id" | jq '{id:.data.id,state:.data.attributes.state,submitted:.data.attributes.submitted,platform:.data.attributes.platform}'
          echo '=== ITEMS ==='
          get "https://api.appstoreconnect.apple.com/v1/reviewSubmissions/$submission_id/items?include=appStoreVersion,gameCenterLeaderboardVersion&limit=200" | jq '{items:[.data[]|{id,state:.attributes.state,relationships}],included:[.included[]?|{id,type,attributes}]}'
          echo '=== VIDEO VERSION ==='
          get "https://api.appstoreconnect.apple.com/v2/gameCenterLeaderboardVersions/$video_version_id" | jq '{id:.data.id,version:.data.attributes.version,state:.data.attributes.state}'
