name: Cancel stale v3 rollout

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cancel-stale-v3-rollout.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale demo-ad rollout
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: "35144863903"
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error -o "$RUNNER_TEMP/cancel.json" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/runs/${RUN_ID}/cancel")"
          cat "$RUNNER_TEMP/cancel.json" || true
          if [ "$code" != "202" ] && [ "$code" != "409" ]; then
            echo "::error::Cancel request returned HTTP ${code}"
            exit 1
          fi
          echo "Cancel request returned HTTP ${code}."
