name: Android Play v7 review status

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/android-play-v7-review-status.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    name: Read existing closed-test lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authenticate to Google Play Developer API
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Read live v7 and prior v6 lifecycle
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.rsm.eztrivia/tracks"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Accept: application/json" \
            "${base}/production-access/releases" > "$RUNNER_TEMP/closed-releases.json"
          jq -r '.releases[]? | "track=\(.track) release=\(.releaseName) versions=\([.activeArtifacts[]?.versionCode] | join(",")) lifecycle=\(.releaseLifecycleState)"' "$RUNNER_TEMP/closed-releases.json"
          state="$(jq -r '[.releases[]? | select(any(.activeArtifacts[]?.versionCode; . == 7)) | .releaseLifecycleState] | first // "absent"' "$RUNNER_TEMP/closed-releases.json")"
          echo "v7_lifecycle=${state}"
          if [ "$state" = "absent" ]; then
            echo "::error::v7 was not found in the original closed-testing track."
            exit 1
          fi
