name: Android release startup smoke

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-release-startup-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-startup-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build minified v3 release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EZTRIVIA_VERSION_CODE: "3"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build minified release bundle
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle bundleRelease --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Archive exact v3 candidate
        uses: actions/upload-artifact@v4
        with:
          name: eztrivia-v3-minified-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Launch minified v3 release candidate
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download exact v3 candidate
        uses: actions/download-artifact@v4
        with:
          name: eztrivia-v3-minified-aab
          path: ${{ runner.temp }}/v3-bundle

      - name: Build signed universal APK from v3 candidate
        shell: bash
        run: |
          set -euo pipefail
          aab="$RUNNER_TEMP/v3-bundle/app-release.aab"
          test -s "$aab"

          curl --fail-with-body --silent --show-error -L \
            "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar" \
            -o "$RUNNER_TEMP/bundletool.jar"

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/smoke.jks" \
            -storepass android \
            -keypass android \
            -alias smoke \
            -dname "CN=EZ Trivia v3 Smoke,O=EZ Trivia,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 30

          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle="$aab" \
            --output="$RUNNER_TEMP/v3-smoke.apks" \
            --mode=universal \
            --ks="$RUNNER_TEMP/smoke.jks" \
            --ks-key-alias=smoke \
            --ks-pass=pass:android \
            --key-pass=pass:android \
            --overwrite

          unzip -p "$RUNNER_TEMP/v3-smoke.apks" universal.apk > "$RUNNER_TEMP/v3-smoke.apk"
          test -s "$RUNNER_TEMP/v3-smoke.apk"
          sha256sum "$RUNNER_TEMP/v3-smoke.apk"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare startup smoke script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/v3-startup-smoke.sh" <<'EOF'
          set -euo pipefail
          install_log="$RUNNER_TEMP/install.txt"
          start_log="$RUNNER_TEMP/start.txt"
          startup_log="$RUNNER_TEMP/v3-logcat.txt"

          adb shell settings put global package_verifier_enable 0 >/dev/null 2>&1 || true
          adb shell settings put global verifier_verify_adb_installs 0 >/dev/null 2>&1 || true
          adb shell pm uninstall com.rsm.eztrivia >/dev/null 2>&1 || true

          : > "$install_log"
          if ! adb install -r "$RUNNER_TEMP/v3-smoke.apk" >> "$install_log" 2>&1; then
            cat "$install_log"
            echo "::error::v3 APK installation failed."
            exit 14
          fi
          cat "$install_log"
          adb shell pm path com.rsm.eztrivia

          adb logcat -c || true
          adb shell am start -W -n com.rsm.eztrivia/.MainActivity > "$start_log" 2>&1 || true
          cat "$start_log"
          sleep 12

          adb logcat -d -v threadtime > "$startup_log"
          pid="$(adb shell pidof com.rsm.eztrivia 2>/dev/null | tr -d '\r' || true)"

          if grep -q -E 'Process: com\.rsm\.eztrivia' "$startup_log" || \
             grep -q -E 'Unable to (instantiate|create|start).*com\.rsm\.eztrivia' "$startup_log"; then
            echo "::error::v3 release candidate crashed during startup."
            grep -A180 -B80 -E 'FATAL EXCEPTION:.*|Process: com\.rsm\.eztrivia|Unable to (instantiate|create|start).*com\.rsm\.eztrivia' "$startup_log" || true
            exit 20
          fi
          if [ -z "$pid" ]; then
            echo "::error::v3 release candidate process did not survive startup."
            tail -n 700 "$startup_log"
            exit 21
          fi
          if ! adb shell dumpsys activity activities | grep -Fq 'com.rsm.eztrivia/.MainActivity'; then
            echo "::error::v3 process survived but MainActivity is not active."
            tail -n 700 "$startup_log"
            exit 22
          fi

          echo "v3 release startup smoke passed; process ${pid} is alive and MainActivity is active."
          {
            echo '## Android v3 startup smoke'
            echo
            echo '- Minified release bundle: **built on Linux and transferred unchanged**'
            echo '- Universal APK: **installed**'
            echo '- Startup fatal exception: **none**'
            echo '- MainActivity after 12 seconds: **active**'
          } >> "$GITHUB_STEP_SUMMARY"
          EOF

      - name: Launch v3 candidate and capture startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          disable-animations: true
          script: bash "$RUNNER_TEMP/v3-startup-smoke.sh"

      - name: Archive startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eztrivia-v3-startup-smoke
          path: |
            ${{ runner.temp }}/install.txt
            ${{ runner.temp }}/start.txt
            ${{ runner.temp }}/v3-logcat.txt
          if-no-files-found: warn
          retention-days: 7
