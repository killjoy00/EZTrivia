name: Android release startup smoke

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-release-startup-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-startup-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build minified v3 release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EZTRIVIA_VERSION_CODE: "3"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build minified release bundle
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle bundleRelease --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Archive exact v3 candidate
        uses: actions/upload-artifact@v4
        with:
          name: eztrivia-v3-minified-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Launch minified v3 release candidate
    needs: build
    runs-on: macos-26-intel
    timeout-minutes: 25

    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download exact v3 candidate
        uses: actions/download-artifact@v4
        with:
          name: eztrivia-v3-minified-aab
          path: ${{ runner.temp }}/v3-bundle

      - name: Build signed universal APK from v3 candidate
        shell: bash
        run: |
          set -euo pipefail
          aab="$RUNNER_TEMP/v3-bundle/app-release.aab"
          test -s "$aab"

          curl --fail-with-body --silent --show-error -L \
            "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar" \
            -o "$RUNNER_TEMP/bundletool.jar"

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/smoke.jks" \
            -storepass android \
            -keypass android \
            -alias smoke \
            -dname "CN=EZ Trivia v3 Smoke,O=EZ Trivia,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 30

          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle="$aab" \
            --output="$RUNNER_TEMP/v3-smoke.apks" \
            --mode=universal \
            --ks="$RUNNER_TEMP/smoke.jks" \
            --ks-key-alias=smoke \
            --ks-pass=pass:android \
            --key-pass=pass:android \
            --overwrite

          unzip -p "$RUNNER_TEMP/v3-smoke.apks" universal.apk > "$RUNNER_TEMP/v3-smoke.apk"
          test -s "$RUNNER_TEMP/v3-smoke.apk"
          shasum -a 256 "$RUNNER_TEMP/v3-smoke.apk"

      - name: Install Android emulator image
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
          sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          avdmanager_bin="$sdk_root/cmdline-tools/latest/bin/avdmanager"

          if [ ! -x "$sdkmanager_bin" ]; then
            sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | head -1)"
          fi
          if [ ! -x "$avdmanager_bin" ]; then
            avdmanager_bin="$(find "$sdk_root/cmdline-tools" -type f -name avdmanager -perm -111 2>/dev/null | head -1)"
          fi
          test -x "$sdkmanager_bin"
          test -x "$avdmanager_bin"

          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" --install \
            platform-tools \
            emulator \
            'system-images;android-35;google_apis_playstore;x86_64' >/dev/null

          echo no | "$avdmanager_bin" create avd \
            --force \
            --name eztrivia-v3 \
            --package 'system-images;android-35;google_apis_playstore;x86_64' \
            --device pixel_6 >/dev/null

          printf 'SDK_ROOT=%s\n' "$sdk_root" >> "$GITHUB_ENV"

      - name: Launch v3 candidate and capture startup
        shell: bash
        run: |
          set -u
          sdk_root="${SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
          adb_bin="$sdk_root/platform-tools/adb"
          emulator_bin="$sdk_root/emulator/emulator"
          emulator_log="$RUNNER_TEMP/emulator.log"
          install_log="$RUNNER_TEMP/install.txt"
          device_apk="/data/local/tmp/eztrivia-v3-smoke.apk"

          deadline() {
            local seconds="$1"
            shift
            python3 -c 'import os, signal, sys; signal.alarm(int(sys.argv[1])); os.execvp(sys.argv[2], sys.argv[2:])' \
              "$seconds" "$@"
          }

          adb_cmd() {
            local seconds="$1"
            shift
            deadline "$seconds" "$adb_bin" -s emulator-5554 "$@"
          }

          "$emulator_bin" \
            -avd eztrivia-v3 \
            -port 5554 \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            >"$emulator_log" 2>&1 &
          emulator_pid=$!

          cleanup() {
            adb_cmd 10 emu kill >/dev/null 2>&1 || true
            kill "$emulator_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          deadline 10 "$adb_bin" start-server >/dev/null 2>&1 || true

          booted=0
          for attempt in $(seq 1 180); do
            state="$(adb_cmd 5 get-state 2>/dev/null || true)"
            boot="$(adb_cmd 5 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$state" = "device" ] && [ "$boot" = "1" ]; then
              booted=1
              break
            fi
            if ! kill -0 "$emulator_pid" >/dev/null 2>&1; then
              echo "::error::Android emulator exited before boot completed."
              tail -n 300 "$emulator_log" || true
              exit 10
            fi
            if [ $((attempt % 30)) -eq 0 ]; then
              deadline 10 "$adb_bin" kill-server >/dev/null 2>&1 || true
              deadline 10 "$adb_bin" start-server >/dev/null 2>&1 || true
            fi
            sleep 2
          done
          if [ "$booted" -ne 1 ]; then
            echo "::error::Android emulator did not boot within six minutes."
            tail -n 300 "$emulator_log" || true
            exit 11
          fi

          ready=0
          for attempt in $(seq 1 45); do
            if adb_cmd 8 shell service check package 2>/dev/null | grep -q 'found' && \
               adb_cmd 8 shell pm path com.google.android.gms >/dev/null 2>&1 && \
               adb_cmd 8 shell cmd package list packages >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Emulator booted but package services were not ready within 90 seconds."
            tail -n 300 "$emulator_log" || true
            exit 12
          fi

          adb_cmd 10 shell settings put global package_verifier_enable 0 >/dev/null 2>&1 || true
          adb_cmd 10 shell settings put global verifier_verify_adb_installs 0 >/dev/null 2>&1 || true
          adb_cmd 10 shell input keyevent 82 >/dev/null 2>&1 || true
          adb_cmd 10 shell wm dismiss-keyguard >/dev/null 2>&1 || true

          : > "$install_log"
          installed=0

          adb_cmd 20 shell pm uninstall com.rsm.eztrivia >> "$install_log" 2>&1 || true
          adb_cmd 20 shell rm -f "$device_apk" >> "$install_log" 2>&1 || true

          echo 'Push APK to emulator' | tee -a "$install_log"
          if ! adb_cmd 60 push "$RUNNER_TEMP/v3-smoke.apk" "$device_apk" >> "$install_log" 2>&1; then
            echo "::error::Failed to push v3 APK to emulator within 60 seconds."
            cat "$install_log"
            exit 13
          fi

          for attempt in 1 2; do
            echo "Device-side install attempt ${attempt}" | tee -a "$install_log"
            if adb_cmd 75 shell pm install -r "$device_apk" >> "$install_log" 2>&1; then
              if adb_cmd 15 shell pm path com.rsm.eztrivia >> "$install_log" 2>&1; then
                installed=1
                break
              fi
            fi
            adb_cmd 20 shell pm uninstall com.rsm.eztrivia >> "$install_log" 2>&1 || true
            sleep 3
          done

          cat "$install_log"
          if [ "$installed" -ne 1 ]; then
            echo "::error::v3 APK could not be installed after two bounded device-side attempts."
            adb_cmd 20 shell df -h /data >> "$install_log" 2>&1 || true
            adb_cmd 20 shell dumpsys package installer >> "$install_log" 2>&1 || true
            cat "$install_log"
            exit 14
          fi

          adb_cmd 10 logcat -c || true
          adb_cmd 30 shell am start -W -n com.rsm.eztrivia/.MainActivity > "$RUNNER_TEMP/start.txt" 2>&1 || true
          cat "$RUNNER_TEMP/start.txt"
          sleep 12

          if ! adb_cmd 30 logcat -d -v threadtime > "$RUNNER_TEMP/v3-logcat.txt"; then
            echo "::error::Could not collect startup logcat within 30 seconds."
            exit 15
          fi

          pid="$(adb_cmd 10 shell pidof com.rsm.eztrivia 2>/dev/null | tr -d '\r' || true)"
          if grep -q -E 'Process: com\.rsm\.eztrivia' "$RUNNER_TEMP/v3-logcat.txt" || \
             grep -q -E 'Unable to (instantiate|create|start).*com\.rsm\.eztrivia' "$RUNNER_TEMP/v3-logcat.txt"; then
            echo "::error::v3 release candidate crashed during startup."
            grep -A180 -B80 -E 'FATAL EXCEPTION:.*|Process: com\.rsm\.eztrivia|Unable to (instantiate|create|start).*com\.rsm\.eztrivia' \
              "$RUNNER_TEMP/v3-logcat.txt" || true
            exit 20
          fi
          if [ -z "$pid" ]; then
            echo "::error::v3 release candidate process did not survive startup."
            tail -n 700 "$RUNNER_TEMP/v3-logcat.txt"
            exit 21
          fi
          if ! adb_cmd 20 shell dumpsys activity activities | grep -Fq 'com.rsm.eztrivia/.MainActivity'; then
            echo "::error::v3 process survived but MainActivity is not active."
            tail -n 700 "$RUNNER_TEMP/v3-logcat.txt"
            exit 22
          fi

          echo "v3 release startup smoke passed; process ${pid} is alive and MainActivity is active."
          {
            echo '## Android v3 startup smoke'
            echo
            echo '- Minified release bundle: **built on Linux and transferred unchanged**'
            echo '- Universal APK: **installed**'
            echo '- Startup fatal exception: **none**'
            echo '- MainActivity after 12 seconds: **active**'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eztrivia-v3-startup-smoke
          path: |
            ${{ runner.temp }}/install.txt
            ${{ runner.temp }}/start.txt
            ${{ runner.temp }}/v3-logcat.txt
            ${{ runner.temp }}/emulator.log
          if-no-files-found: warn
          retention-days: 7
