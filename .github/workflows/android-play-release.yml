name: Android Play Release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Play version code (must increase for every upload)"
        required: true
        default: "1"
        type: string
      version_name:
        description: "Player-facing version name"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: read

concurrency:
  group: android-play-release
  cancel-in-progress: false

jobs:
  bundle:
    name: Build signed Play bundle
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Validate release inputs
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::version_code must be a positive integer"
            exit 1
          fi
          if [[ -z "$VERSION_NAME" ]]; then
            echo "::error::version_name cannot be empty"
            exit 1
          fi

      - name: Materialize upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo "::error::Missing ANDROID_UPLOAD_KEYSTORE_BASE64 or ANDROID_UPLOAD_KEY_PASSWORD repository secret"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/eztrivia-upload.p12"
          keytool -list \
            -keystore "$RUNNER_TEMP/eztrivia-upload.p12" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias upload >/dev/null
          chmod 600 "$RUNNER_TEMP/eztrivia-upload.p12"

      - name: Run release unit tests
        run: gradle testReleaseUnitTest --stacktrace

      - name: Build signed release AAB
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/eztrivia-upload.p12
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          EZTRIVIA_VERSION_CODE: ${{ inputs.version_code }}
          EZTRIVIA_VERSION_NAME: ${{ inputs.version_name }}
        run: gradle bundleRelease --stacktrace

      - name: Verify bundle signature
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          jarsigner -verify -strict "$AAB"
          echo "Signed bundle ready: $AAB"

      - name: Write release metadata
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          {
            echo "commit=$GITHUB_SHA"
            echo "versionCode=$VERSION_CODE"
            echo "versionName=$VERSION_NAME"
            echo "package=com.rsm.eztrivia"
          } > app/build/outputs/bundle/release/release-info.txt

      - name: Upload Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: eztrivia-play-v${{ inputs.version_code }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/bundle/release/release-info.txt
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30
