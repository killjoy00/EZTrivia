name: TestFlight

# Builds a signed archive on a macOS runner and uploads it to TestFlight.
# Run it from the Actions tab: "TestFlight" -> "Run workflow".
#
# Requires these repository secrets (Settings -> Secrets and variables -> Actions):
#
#   APP_STORE_CONNECT_KEY_ID        Key ID of an App Store Connect API key
#   APP_STORE_CONNECT_ISSUER_ID     Issuer ID from the same Keys page
#   APP_STORE_CONNECT_PRIVATE_KEY   Full contents of the .p8 file, newlines and all
#   GOOGLE_SERVICE_INFO_PLIST       Contents of GoogleService-Info.plist (optional)
#
# The API key needs the App Manager role. Nothing else needs to be installed and
# no certificate or provisioning profile has to be exported by hand: automatic
# signing fetches them through -allowProvisioningUpdates using the same key.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (must be higher than the last upload)"
        required: true
        type: string

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Verify the core package before spending a build
        run: swift test

      # Firebase is optional at runtime: Telemetry.configure() no-ops when the
      # plist is absent, so a missing secret produces a working build without
      # analytics rather than a failure.
      - name: Add GoogleService-Info.plist
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$PLIST" ]; then
            echo "No GoogleService-Info.plist secret set; building without Firebase."
            exit 0
          fi
          printf '%s' "$PLIST" > EZTriviaApp/GoogleService-Info.plist
          plutil -lint EZTriviaApp/GoogleService-Info.plist

      - name: Install the App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - name: Archive
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project EZTrivia.xcodeproj \
            -scheme EZTrivia \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/EZTrivia.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ inputs.build_number }} \
            | xcbeautify

      - name: Export the IPA
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>3564X3VTDB</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/EZTrivia.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            | xcbeautify

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/EZTrivia.ipa" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      # Keeps the build inspectable if the upload is rejected.
      - name: Save the IPA as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EZTrivia-${{ inputs.build_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
