name: Play Games Configuration Smoke

on:
  push:
    branches: [android/signing-secret-check]
    paths:
      - ".github/workflows/pgs-configuration-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Inspect Play Games configuration response
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          URL="https://gamesconfiguration.googleapis.com/games/v1configuration/applications/406580555223/achievements"
          BODY="$RUNNER_TEMP/pgs-response.json"
          STATUS="$(curl -sS -o "$BODY" -w '%{http_code}' \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "$URL")"
          echo "HTTP ${STATUS}"
          cat "$BODY"
          test "$STATUS" = "200"
