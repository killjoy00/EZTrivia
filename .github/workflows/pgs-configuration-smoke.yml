name: Play Games Configuration Smoke

on:
  push:
    branches: [android/signing-secret-check]
    paths:
      - ".github/workflows/pgs-configuration-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: List Play Games configuration
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          BASE="https://gamesconfiguration.googleapis.com/games/v1configuration/applications/406580555223"
          echo "Achievements:"
          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "${BASE}/achievements" \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); print(len(data.get("items", [])))'
          echo "Leaderboards:"
          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "${BASE}/leaderboards" \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); print(len(data.get("items", [])))'
