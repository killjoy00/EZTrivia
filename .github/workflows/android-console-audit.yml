name: Android Play Console Audit

on:
  push:
    branches:
      - android-launch-console-setup-3
    paths:
      - .github/workflows/android-console-audit.yml
      - Scripts/play_console_audit.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google auth client
        run: python -m pip install --disable-pip-version-check google-auth requests

      - name: Audit Play Console state
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: python Scripts/play_console_audit.py

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: play-console-audit
          path: play-console-audit.json
          if-no-files-found: error
          retention-days: 7
