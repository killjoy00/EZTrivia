name: Android Play Store Screenshots

on:
  push:
    branches:
      - android-launch-console-setup-3
    paths:
      - .github/workflows/android-play-screenshots.yml
      - android/app/src/androidTest/**
      - android/app/src/main/**
      - android/app/build.gradle.kts
      - Scripts/upload_play_screenshots.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install Play API auth client
        run: pip install --quiet google-auth requests

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run screenshot instrumentation
        id: capture
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: cd android; gradle connectedDebugAndroidTest --stacktrace; status=$?; cd ..; if [ "$status" -eq 0 ]; then mkdir -p play-store-screenshots; adb shell ls -la /sdcard/Android/data/com.rsm.eztrivia/files/play-store-screenshots; adb pull /sdcard/Android/data/com.rsm.eztrivia/files/play-store-screenshots/. play-store-screenshots/; file play-store-screenshots/*.png; fi; exit "$status"

      - name: Surface screenshot test failures
        if: always()
        run: |
          find android/app/build/outputs/androidTest-results/connected -type f -name '*.xml' -print -exec cat {} \; 2>/dev/null || true

      - name: Stop on failed screenshot tests
        if: steps.capture.outcome != 'success'
        run: exit 1

      - name: Upload screenshots to Play listing
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: python Scripts/upload_play_screenshots.py

      - name: Archive screenshots
        uses: actions/upload-artifact@v4
        with:
          name: android-play-store-screenshots
          path: play-store-screenshots/*.png
          if-no-files-found: error
          retention-days: 30
