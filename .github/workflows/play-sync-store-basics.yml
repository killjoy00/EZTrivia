name: Sync Play Store basics

on:
  workflow_dispatch:
  push:
    branches:
      - play-release-audit
    paths:
      - .github/workflows/play-sync-store-basics.yml
      - Scripts/make_play_store_icon.py
      - Scripts/sync_play_store_basics.py
      - EZTriviaApp/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Play Store tooling
        run: pip install --quiet pillow requests

      - name: Generate Play Store icon
        run: python Scripts/make_play_store_icon.py

      - name: Authenticate to Google Play Developer API
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Sync and verify Play Store basics
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python Scripts/sync_play_store_basics.py

      - name: Archive generated store icon
        uses: actions/upload-artifact@v4
        with:
          name: eztrivia-play-store-icon
          path: play-store-assets/icon.png
          if-no-files-found: error
          retention-days: 30
