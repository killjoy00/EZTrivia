name: Firebase Crashlytics bootstrap

on:
  push:
    branches: ["hardening/android-testability"]
    paths:
      - ".github/workflows/firebase-crashlytics-bootstrap.yml"

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Google Cloud project
        id: project
        env:
          SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          project_id="$(jq -r '.project_id // empty' <<<"$SERVICE_ACCOUNT")"
          test -n "$project_id"
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"

      - name: Authenticate for Google Cloud and Firebase management
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false

      - name: Enable Firebase Management API
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${ACCESS_TOKEN}" -H "Content-Type: application/json")
          url="https://serviceusage.googleapis.com/v1/projects/${PROJECT_ID}/services/firebase.googleapis.com:enable"
          code="$(curl --silent --show-error -o "$RUNNER_TEMP/service-enable.json" -w '%{http_code}' -X POST "$url" "${auth[@]}" -d '{}')"
          echo "Enable Firebase Management API HTTP ${code}"
          cat "$RUNNER_TEMP/service-enable.json"
          if [[ "$code" != "200" ]]; then
            exit 10
          fi

          op="$(jq -r '.name // empty' "$RUNNER_TEMP/service-enable.json")"
          if [[ -n "$op" ]]; then
            for i in $(seq 1 30); do
              result="$(curl --fail-with-body --silent --show-error "https://serviceusage.googleapis.com/v1/${op}" "${auth[@]}")"
              if [[ "$(jq -r '.done // false' <<<"$result")" == "true" ]]; then
                if jq -e '.error' <<<"$result" >/dev/null; then
                  jq '.error' <<<"$result"
                  exit 11
                fi
                break
              fi
              sleep 2
            done
          fi

      - name: Add Firebase and create or reuse Android app
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${ACCESS_TOKEN}" -H "Content-Type: application/json")
          base="https://firebase.googleapis.com/v1beta1"

          project_code="$(curl --silent --show-error -o "$RUNNER_TEMP/firebase-project.json" -w '%{http_code}' "${base}/projects/${PROJECT_ID}" "${auth[@]}")"
          if [[ "$project_code" == "404" ]]; then
            add_code="$(curl --silent --show-error -o "$RUNNER_TEMP/add-firebase.json" -w '%{http_code}' -X POST "${base}/projects/${PROJECT_ID}:addFirebase" "${auth[@]}" -d '{}')"
            echo "Add Firebase HTTP ${add_code}"
            cat "$RUNNER_TEMP/add-firebase.json"
            [[ "$add_code" == "200" ]] || exit 20
            op="$(jq -r '.name' "$RUNNER_TEMP/add-firebase.json")"
            for i in $(seq 1 60); do
              result="$(curl --fail-with-body --silent --show-error "${base}/${op}" "${auth[@]}")"
              if [[ "$(jq -r '.done // false' <<<"$result")" == "true" ]]; then
                if jq -e '.error' <<<"$result" >/dev/null; then
                  jq '.error' <<<"$result"
                  exit 21
                fi
                break
              fi
              sleep 2
            done
          elif [[ "$project_code" != "200" ]]; then
            cat "$RUNNER_TEMP/firebase-project.json"
            exit 22
          fi

          apps="$(curl --fail-with-body --silent --show-error "${base}/projects/${PROJECT_ID}/androidApps" "${auth[@]}")"
          printf '%s' "$apps" > "$RUNNER_TEMP/android-apps-before.json"
          app_name="$(jq -r '[.apps[]? | select(.packageName == "com.rsm.eztrivia") | .name] | first // empty' <<<"$apps")"

          if [[ -z "$app_name" ]]; then
            create_code="$(curl --silent --show-error -o "$RUNNER_TEMP/create-android-app.json" -w '%{http_code}' -X POST "${base}/projects/${PROJECT_ID}/androidApps" "${auth[@]}" -d '{"displayName":"EZ Trivia Android","packageName":"com.rsm.eztrivia"}')"
            echo "Create Android app HTTP ${create_code}"
            cat "$RUNNER_TEMP/create-android-app.json"
            [[ "$create_code" == "200" ]] || exit 23
            op="$(jq -r '.name' "$RUNNER_TEMP/create-android-app.json")"
            for i in $(seq 1 60); do
              result="$(curl --fail-with-body --silent --show-error "${base}/${op}" "${auth[@]}")"
              if [[ "$(jq -r '.done // false' <<<"$result")" == "true" ]]; then
                if jq -e '.error' <<<"$result" >/dev/null; then
                  jq '.error' <<<"$result"
                  exit 24
                fi
                app_name="$(jq -r '.response.name // empty' <<<"$result")"
                break
              fi
              sleep 2
            done
          fi

          test -n "$app_name"
          echo "Firebase Android app: $app_name"
          config="$(curl --fail-with-body --silent --show-error "${base}/${app_name}/config" "${auth[@]}")"
          printf '%s' "$config" > "$RUNNER_TEMP/firebase-config-response.json"
          jq -r '.configFileContents' <<<"$config" | base64 --decode > "$RUNNER_TEMP/google-services.json"
          jq -e 'any(.client[]?; .client_info.android_client_info.package_name == "com.rsm.eztrivia")' "$RUNNER_TEMP/google-services.json" >/dev/null
          jq '{project_info, client: [.client[] | {client_info, api_key}]}' "$RUNNER_TEMP/google-services.json"

      - name: Archive Firebase Android config
        uses: actions/upload-artifact@v4
        with:
          name: eztrivia-firebase-android-config
          path: |
            ${{ runner.temp }}/google-services.json
            ${{ runner.temp }}/firebase-project.json
            ${{ runner.temp }}/android-apps-before.json
            ${{ runner.temp }}/firebase-config-response.json
          if-no-files-found: error
          retention-days: 7
