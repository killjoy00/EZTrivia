name: Google Play Data Safety

on:
  push:
    branches:
      - android-data-safety-impl
    paths:
      - Scripts/configure_play_data_safety.py
      - .github/workflows/play-data-safety.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Authenticate to Google Play Developer API
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Build and submit Data safety declaration
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python Scripts/configure_play_data_safety.py --submit

      - name: Archive submitted CSV
        uses: actions/upload-artifact@v4
        with:
          name: eztrivia-play-data-safety
          path: play-data-safety/eztrivia-data-safety.csv
          if-no-files-found: error
          retention-days: 30
