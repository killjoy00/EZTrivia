name: Configure Android Play Launch

on:
  push:
    branches:
      - android-launch-console-setup-3
    paths:
      - .github/workflows/configure-android-play-launch.yml
      - Scripts/configure_android_play_launch.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google auth client
        run: pip install --quiet google-auth requests

      - name: Configure Play listing and Remove Ads product
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: python Scripts/configure_android_play_launch.py
