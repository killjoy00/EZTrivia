name: Upload Ultimate Tic/Tac/Toe Remove Ads IAP review screenshot
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ultttt-iap-review-screenshot.yml"
      - "Scripts/ultttt_iap_review_image.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ultttt-iap-review-image
  cancel-in-progress: false
jobs:
  review-image:
    name: Capture real StoreKit paywall SwiftUI screen and upload to Apple IAP
    runs-on: xcode-27
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout immutable reviewed iOS IAP screenshot code
        uses: actions/checkout@v4
        with:
          repository: killjoy00/Ultttt
          ref: 0eabd6eb7b0038bcc52bdb4c65f870363a98ee9b
          path: ultttt
          persist-credentials: false
      - name: Verify exact code and real paywall
        working-directory: ultttt
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0eabd6eb7b0038bcc52bdb4c65f870363a98ee9b
          grep -Fq 'CFBundleDisplayName: Ultimate Tic/Tac/Toe' project.yml
          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER: com.killjoy00.ultttt' project.yml
          grep -Fq 'case "iap":' UltimateTTTApp/AppStoreScreenshotHost.swift
          grep -Fq 'RemoveAdsSheet(purchases: purchases, ads: ads, reviewPreviewPrice: "$1.99")' UltimateTTTApp/AppStoreScreenshotHost.swift
      - name: Select Xcode 27 and XcodeGen
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27"
      - name: Verify App Store iOS SDK floor
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          major="${sdk%%.*}"
          if (( major < 27 )); then echo "::error::iOS 27 SDK required, found $sdk"; exit 1; fi
      - run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Run rules tests
        working-directory: ultttt
        run: swift test
      - name: Build iPhone debug app
        working-directory: ultttt
        run: |
          set -euo pipefail
          swift tools/generate-app-icon.swift
          xcodegen generate
          xcodebuild build -project UltimateTTT.xcodeproj -scheme UltimateTTT \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ultttt-dd" CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/ultttt-iap-build.log" 2>&1 || {
              tail -110 "$RUNNER_TEMP/ultttt-iap-build.log"
              exit 1
            }
      - name: Select compatible iPhone device and boot
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          python3 - "$RUNNER_TEMP/simulators.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json,sys,subprocess
          devices=json.load(open(sys.argv[1]))["devices"]
          sdk=subprocess.check_output(["xcrun","--sdk","iphonesimulator","--show-sdk-version"],text=True).strip()
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-"+sdk.replace(".","-")
          if runtime not in devices:
              sys.exit("Missing simulator for SDK "+sdk+"; available: "+str(list(devices)))
          options=[d for d in devices[runtime] if d.get("isAvailable",True) and d["name"].startswith("iPhone")]
          if not options:sys.exit("Missing available iPhone")
          pick=next((d for d in options if d["name"]=="iPhone 16 Pro Max"),options[0])
          print("udid="+pick["udid"])
          print("Selected",pick["name"],"runtime",runtime,file=sys.stderr)
          PY
      - name: Capture actual Remove Ads screen
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/iap-review"
          bounded() {
            limit="$1"; shift
            python3 - "$limit" "$@" <<'PY'
          import subprocess,sys
          try:
              result=subprocess.run(sys.argv[2:],text=True,stdout=subprocess.PIPE,
                                    stderr=subprocess.STDOUT,timeout=int(sys.argv[1]))
              if result.stdout:print(result.stdout[-2800:],flush=True)
              sys.exit(result.returncode)
          except subprocess.TimeoutExpired:
              print("Simulator command timed out: "+" ".join(sys.argv[2:]),flush=True)
              sys.exit(124)
          PY
          }
          bounded 90 xcrun simctl boot "$UDID" || true
          bounded 650 xcrun simctl bootstatus "$UDID" -b
          bounded 360 xcrun simctl install "$UDID" \
            "$RUNNER_TEMP/ultttt-dd/Build/Products/Debug-iphonesimulator/UltimateTTT.app"
          bounded 180 xcrun simctl launch "$UDID" com.killjoy00.ultttt \
            -UltimateStoreScreenshot iap
          sleep 9
          bounded 180 xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/iap-review/raw-iap.png"

      - name: Verify Apple-compliant screenshot file
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/iap-env"
          "$RUNNER_TEMP/iap-env/bin/python" -m pip install --quiet pillow 'PyJWT[crypto]' requests
          "$RUNNER_TEMP/iap-env/bin/python" - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image,ImageOps,ImageStat
          dest=Path(os.environ["RUNNER_TEMP"])/"iap-review"
          with Image.open(dest/"raw-iap.png") as im:
              if im.width<1000 or im.height<2400:raise SystemExit("iPhone simulator screenshot too small")
              rgb=ImageOps.fit(im.convert("RGB"),(1290,2796),Image.Resampling.LANCZOS)
              if ImageStat.Stat(rgb.resize((60,120))).stddev[0]<10:raise SystemExit("Blank UI image")
              output=dest/"ultttt-remove-ads-review.png"
              rgb.save(output,"PNG",optimize=True)
              print("Actual SwiftUI Remove Ads screen:",output,output.stat().st_size)
          PY

      - name: Upload review screenshot for $1.99 nonconsumable purchase
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_KEY_P8"
          "$RUNNER_TEMP/iap-env/bin/python" Scripts/ultttt_iap_review_image.py
      - name: Save review screenshot for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ultttt-Remove-Ads-App-Review-Screenshot
          path: ${{ runner.temp }}/iap-review/*.png
          if-no-files-found: ignore
          retention-days: 60
